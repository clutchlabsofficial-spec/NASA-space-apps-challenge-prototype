 the orbit against the equator — sets which parts of Earth you ever fly over at all. Low Earth orbit means roughly a 90-minute lap, so you get an orbital sunrise and sunset about sixteen times a day.",x:"Before you build anything, you pick where your satellite will fly. Fly low and you see small things clearly, but the tiny bit of air up there slows you down and you fall sooner. Fly high and you last longer but see less detail. Whether you tilt your path over the poles decides which countries you fly above."},realTalk:{e:"Most university CubeSats do not choose their orbit at all — they ride along with whatever launch has a spare slot, and the mission is designed around that orbit afterwards.",x:"Fun fact: most school satellites do not get to choose! They hitch a ride with a bigger rocket and go wherever it is going."},sources:["soa-deorbit","cubesat101"],options:[{id:"iss",level:"both",name:{e:"ISS resupply orbit (~400 km, 51.6°)",x:"Space Station orbit — low and tilted"},blurb:{e:"Deployed from the International Space Station. The easiest ride to get, and the shortest life.",x:"Get pushed out of the Space Station by an astronaut-loaded launcher."},how:{e:"Your CubeSat launches to the ISS inside a cargo vehicle, is unpacked by the crew, loaded into a deployer on the Japanese module’s airlock, and sprung out by a robotic arm. You inherit the station’s orbit exactly: about 400 km altitude and 51.6° inclination.",x:"Your satellite rides up to the Space Station in a delivery ship. Astronauts unpack it, put it in a spring-loaded launcher, and a robot arm pushes it gently out into space."},whyChosen:{e:"It is the most accessible path for student and first-flight missions, and the low altitude means you deorbit naturally within a couple of years with no hardware at all — automatic debris compliance. NASA’s CubeSat Launch Initiative has flown many ELaNa missions this way.",x:"It is the friendliest way to get to space for a first satellite. And because it is so low, the air slowly pulls it back down on its own, so it never becomes space junk."},madeOf:{e:"No hardware of your own — the deployer (a NanoRacks or JEM-style spring-loaded tube) belongs to the launch provider. You just have to survive the ride and meet its interface rules.",x:"You do not build anything for this — you just have to fit inside the launcher tube."},tradeoffs:{strengths:[{e:"Cheapest and most available ride for a first mission.",x:"Easiest ride to get."},{e:"Natural decay well inside the 5-year disposal rule with no deorbit hardware.",x:"Comes down by itself — no space junk."},{e:"Low altitude means finer ground detail for a given camera.",x:"You are closer, so you see more detail."}],limits:[{e:"51.6° inclination never flies over the poles — no high-latitude coverage at all.",x:"You never fly over the very top or bottom of Earth."},{e:"Lighting at a given spot changes every pass, so images are hard to compare over time.",x:"The sunlight is different every time, so photos do not match each other."},{e:"Mission life is typically only about 1–2 years before drag pulls you down.",x:"Your satellite only lasts a year or two."}]},facts:[{label:"Altitude",value:"~400 km"},{label:"Inclination",value:"51.6°"},{label:"Natural decay",value:"NASA SoA: below 400 km, most small satellites decay naturally within 5 years"}],flown:"Dozens of NASA ELaNa CubeSats deployed from the ISS via the JEM airlock",sources:["cubesat101","soa-deorbit"],tags:["orbit:iss","orbit:low","orbit:inclined","orbit:short-life","orbit:no-poles","orbit:variable-lighting"]},{id:"sso",level:"both",name:{e:"Sun-synchronous orbit (~500–600 km, ~97.7°)",x:"Sun-following orbit — over the poles"},blurb:{e:"Crosses every point on Earth at the same local solar time. The workhorse orbit for Earth observation.",x:"Flies over the North and South poles, and always arrives at the same time of day."},how:{e:"Earth is slightly fat around the equator, which tugs on an orbit and slowly rotates its plane. At a specific retrograde inclination near 98°, that drift is exactly one full turn per year — so the orbit plane keeps pace with Earth going round the Sun. The result: you cross the equator at, say, 10:30 am local time on every single orbit, forever.",x:"Earth is a bit squashed, and that gently pushes satellite paths around. If you tilt your orbit just right, that push keeps your satellite lined up with the Sun — so you always arrive at the same time of day, like a very punctual bus."},whyChosen:{e:"Consistent lighting is enormously valuable: two images of the same field taken a month apart have the same sun angle and shadows, so a real change in the ground is not confused with a change in the light. Polar coverage also means the whole planet passes underneath you as Earth rotates.",x:"Because the light is always the same, you can compare photos taken weeks apart and be sure any difference is real, not just different shadows."},madeOf:{e:"Again, no hardware — it is a launch-vehicle choice. SSO is a very common rideshare destination, so it is realistically obtainable.",x:"Nothing to build — you just book the right rocket."},tradeoffs:{strengths:[{e:"Repeatable sun angle makes time-series comparison scientifically valid.",x:"Photos always match, so you can spot real changes."},{e:"Near-polar inclination gives global coverage including high latitudes.",x:"You fly over the whole planet, poles included."},{e:"Long eclipse-free stretches on some SSO planes ease the power budget.",x:"Lots of sunshine for your solar panels."}],limits:[{e:"At 500–600 km, natural decay usually exceeds 5 years, so a disposal plan is required.",x:"Too high to fall down on its own — you must plan how to bring it back."},{e:"A fixed local crossing time means you never observe the same place at other times of day.",x:"You only ever see each place at one time of day."},{e:"Higher altitude means coarser detail than a very low orbit for the same optics.",x:"A bit further away, so slightly less detail."}]},facts:[{label:"Typical altitude",value:"475–600 km (Planet operates Doves at 475–525 km)"},{label:"Inclination",value:"~97–98° (retrograde)"},{label:"Disposal",value:"NASA SoA: 400–800 km generally needs a passive deorbit system to meet 5 years"}],flown:"Planet Dove / SuperDove constellation; most commercial Earth-observation CubeSats",sources:["eo-planet","soa-deorbit"],tags:["orbit:sso","orbit:polar","orbit:consistent-lighting","orbit:needs-disposal","orbit:medium"]},{id:"vleo",level:"engineer",name:{e:"Very low Earth orbit (~300 km)",x:"Super-low orbit — fast and close"},blurb:{e:"Skim the top of the atmosphere for maximum resolution and minimum signal loss. Short, aggressive missions only.",x:"Fly really low to see really well — but not for long."},how:{e:"At 300 km there is still a thin but real atmosphere. Drag is orders of magnitude stronger than at 600 km and varies with solar activity, so your altitude visibly decays week by week unless you thrust to maintain it.",x:"Even way up at 300 km there is a tiny bit of air. It is enough to slow you down a little every orbit, so you sink lower and lower."},whyChosen:{e:"Ground resolution scales with distance, and radio link budget improves as the square of range, so flying low buys you sharper images and stronger signals from smaller hardware. It also guarantees rapid, automatic disposal.",x:"Being closer means sharper pictures and a stronger radio signal with a smaller antenna."},madeOf:{e:"Usually a compact, drag-minimising shape, sometimes with atomic-oxygen-resistant coatings, since atomic oxygen at these altitudes erodes exposed polymers and some coatings.",x:"Satellites down here are built slim, and painted with tough coatings, because the thin air slowly wears them away."},tradeoffs:{strengths:[{e:"Best ground sampling distance and link budget of any option here.",x:"Sharpest pictures, strongest radio."},{e:"Disposal is automatic and fast — fully compliant with no hardware.",x:"Comes down by itself, quickly."}],limits:[{e:"Mission life measured in months without propulsion.",x:"Only lasts a few months."},{e:"Atomic oxygen erodes exposed materials; coatings darken faster.",x:"The thin air slowly eats away at surfaces."},{e:"Drag torque disturbs attitude, making pointing harder.",x:"The air pushes it around, so it is harder to hold steady."}]},facts:[{label:"Altitude",value:"~300 km"},{label:"Life without propulsion",value:"Months"},{label:"Solar cycle",value:"NASA SoA: drag increases at solar maximum, so decay is faster"}],flown:"NASA TechEdSat Exo-Brake experiments operated in this regime (TES-7 reentered from 485–513 km in ~1.3 years)",sources:["soa-deorbit"],tags:["orbit:vleo","orbit:low","orbit:short-life","orbit:high-drag","orbit:inclined"]}]},rp={id:"payload",order:2,code:"PL",name:{e:"Payload — the Instrument",x:"The Job Tool"},subtitle:{e:"The one part that is not there to keep the satellite alive",x:"The part that actually does the job"},question:{e:"What instrument will you fly?",x:"What will your satellite use to do its job?"},primer:{e:"Everything else on a satellite exists to serve the payload. Engineers say the payload drives the bus: the instrument decides how much power you need, how steadily you must point, how cold something has to be kept, and how much data you must get to the ground. That is why real teams pick the instrument early and design the rest of the spacecraft around it.",x:"The payload is the tool that does the actual job — a camera, a radio ear, a particle counter. Everything else on the satellite is there to look after it: keep it powered, keep it pointed the right way, keep it at the right temperature, and send its results home."},realTalk:{e:"You can absolutely fly an instrument that does not match your mission. The satellite will work perfectly and return data nobody needs. Mission failure is usually not hardware failure.",x:"You can pick any tool you like — but if it is the wrong tool for the job, your satellite will work fine and still not answer your question."},sources:["cubesat101"],options:[{id:"thermal-ir",level:"both",name:{e:"Uncooled thermal infrared imager",x:"Heat camera"},blurb:{e:"A microbolometer array that images emitted heat, not reflected sunlight.",x:"A camera that sees how hot things are, even in the dark."},how:{e:"Each pixel is a tiny suspended membrane whose electrical resistance changes when infrared radiation warms it by a fraction of a degree. Because the scene is glowing in the infrared by itself rather than reflecting sunlight, the instrument works at night and sees straight through smoke, which scatters visible light but is fairly transparent in the long-wave infrared.",x:"Inside the camera are millions of tiny pads. When heat rays land on a pad it warms up a tiny bit, and the camera notices. Because hot things glow with heat rays all by themselves, it works at night — and smoke does not block it."},madeOf:{e:"Vanadium oxide or amorphous silicon microbolometer membranes on a silicon readout chip, behind germanium or chalcogenide glass optics — ordinary glass is opaque in the thermal infrared, so the lenses look like polished metal.",x:"The lens is not made of glass — glass blocks heat rays. It is made of a shiny metal-looking material called germanium."},whyChosen:{e:"Uncooled means no cryocooler, which is the single biggest reason thermal imaging is now practical on a CubeSat. You trade sensitivity for an instrument that fits in a few units and runs on a couple of watts. OroraTech pairs long-wave and mid-wave channels so it can catch both hot open flame and cooler smouldering ground.",x:"Some heat cameras need a fridge inside them, which is big and heavy. This kind does not — which is why it fits in a satellite the size of a cereal box."},tradeoffs:{strengths:[{e:"Works at night and through smoke — the only option here that does.",x:"Works in the dark and through smoke."},{e:"No cryocooler: low power, no moving parts, no vibration.",x:"No fridge needed, so it stays small and quiet."}],limits:[{e:"Much less sensitive than a cooled detector; coarser ground resolution than a visible camera of the same size.",x:"Pictures are blurrier than a normal camera."},{e:"The detector needs a stable, known temperature, so it hands a real problem to the thermal subsystem.",x:"It only works well if you keep it at a steady temperature."},{e:"Cannot tell you the colour of anything or read a licence plate — it only measures heat.",x:"It only sees heat — no colours."}]},facts:[{label:"Real performance",value:"OroraTech SAFIRE: ~410 km combined swath, 200 m ground sampling distance, two LWIR + one MWIR channel"},{label:"Accuracy",value:"±1 °C absolute temperature accuracy"},{label:"Detects",value:"Fire hotspots as small as ~4 m × 4 m"}],flown:"OroraTech FOREST-1 (3U) and FOREST-2 (6U)",sources:["eo-ororatech"],tags:["payload:thermal-ir","need:thermal-stability","need:pointing-moderate","need:medium-data","cap:sees-heat","cap:night","cap:through-smoke"]},{id:"vis-multispectral",level:"both",name:{e:"Visible / near-infrared multispectral imager",x:"Colour camera (plus a secret colour)"},blurb:{e:"A telescope and CCD/CMOS sensor imaging a handful of chosen colour bands.",x:"A camera that sees normal colours and one extra colour plants love."},how:{e:"Sunlight reflects off the ground into a compact telescope and onto an imaging sensor filtered into discrete bands — typically blue, green, red and near-infrared. Comparing bands is the whole point: healthy chlorophyll absorbs red strongly and reflects near-infrared strongly, so the red/NIR ratio maps plant vigour.",x:"It is a telescope with a camera behind it. It takes several photos at once in different colours, including one our eyes cannot see. Healthy leaves shine brightly in that hidden colour, so the satellite can tell healthy plants from sick ones."},madeOf:{e:"Aluminium or carbon-fibre telescope barrel, glass or mirror optics, a silicon CMOS or CCD focal plane, and interference filters. The barrel material matters: it must not change focus as the satellite swings between sunlight and eclipse.",x:"A tube, some lenses or mirrors, and a light sensor like the one in a phone camera — but much better made."},whyChosen:{e:"It is the highest information-per-kilogram instrument for land applications, and silicon detectors are cheap, mature and need no cooling. Planet built a business on flying hundreds of them on 3U buses.",x:"Cameras like this are the most useful for looking at land, and the parts are cheap and well understood."},tradeoffs:{strengths:[{e:"Excellent resolution for the size: ~3–5 m from a 3U bus.",x:"Very sharp pictures for such a small satellite."},{e:"Mature, inexpensive, no cooling required.",x:"Cheap and reliable."}],limits:[{e:"Blind at night and blocked by cloud and smoke — it needs reflected sunlight.",x:"Useless at night, and clouds and smoke get in the way."},{e:"Image data is large, so it forces a high-rate downlink and onboard storage.",x:"Photos are big files, so you need a fast radio to send them home."},{e:"Needs steady pointing during exposure or the image smears.",x:"If the satellite wobbles, the photo comes out blurry."}]},facts:[{label:"Real performance",value:"Planet Dove: ~3–5 m spatial resolution from a 3U, ~5.2 kg satellite"},{label:"Operating orbit",value:"475–525 km sun-synchronous"}],flown:"Planet Dove and SuperDove — the largest Earth-imaging constellation ever flown",sources:["eo-planet"],tags:["payload:vis","need:pointing-tight","need:high-data","need:sunlight","cap:sees-colour","cap:high-res"]},{id:"hyperspectral",level:"engineer",name:{e:"Hyperspectral imager",x:"Super-colour camera"},blurb:{e:"Splits incoming light into dozens or hundreds of narrow bands per pixel.",x:"Sees hundreds of colours instead of three."},how:{e:"A slit and a dispersing element (a prism or diffraction grating) spread each ground line into a spectrum across the detector, so every pixel carries a continuous spectral curve rather than three or four numbers. Materials have narrow absorption features, so you can identify what something is made of, not just what colour it looks.",x:"Instead of red, green and blue, it splits the light into hundreds of tiny colour slices — like a rainbow for every dot on the ground. Different materials make different rainbow patterns, so you can tell what things are made of."},madeOf:{e:"Precision slit, grating or prism, relay optics and a large-format detector, all in a housing that must hold alignment to microns through launch vibration and thermal cycling.",x:"Very precisely made mirrors and a special grooved surface that splits light into a rainbow. Everything must stay perfectly lined up."},whyChosen:{e:'Chosen when the question is "what is it made of", not "where is it": mineral mapping, crop species and disease discrimination, water quality, methane plumes.',x:"Used when you need to know exactly what something is made of — like which crop it is, or whether water is polluted."},tradeoffs:{strengths:[{e:"Identifies materials and plant species, not just brightness.",x:"Can tell what things actually are."},{e:"One instrument serves many science questions.",x:"Useful for lots of different jobs."}],limits:[{e:"Enormous data volume — the hardest downlink problem of any payload here.",x:"Makes gigantic files that are hard to send home."},{e:"Each narrow band collects little light, so it needs long integration and very stable pointing.",x:"Needs to hold very still while it works."},{e:"Alignment sensitivity makes it the hardest instrument on this list to build and calibrate.",x:"Very hard to build and keep working."}]},facts:[{label:"Trade",value:"Spectral detail is bought with light: more bands means less signal per band"}],flown:"Flown on small satellites such as ESA’s HyperScout and several 6U/12U commercial demonstrators",sources:["soa-struct"],tags:["payload:hyperspectral","need:pointing-tight","need:very-high-data","need:sunlight","need:volume","cap:sees-colour","cap:identifies-materials"]},{id:"sdr-receiver",level:"both",name:{e:"Software-defined radio receiver (AIS / ADS-B)",x:"Big listening ear"},blurb:{e:"A wideband radio that listens for beacons transmitted by ships and aircraft.",x:"Listens for the radio messages ships and planes send out."},how:{e:"An antenna and low-noise front end feed a digitiser; from there the signal is software, not hardware, so one radio can be reprogrammed in orbit to decode different message formats. The hard part is collision: from 400 km you hear thousands of ships at once on the same VHF channels, so the decoder must pull overlapping messages apart.",x:"It is a radio where the tuning is done by a computer program instead of knobs, so you can teach it new things after launch. The tricky bit is that from space you hear thousands of ships shouting at once, and you have to untangle them."},madeOf:{e:"A deployable VHF antenna, a low-noise amplifier, a fast analogue-to-digital converter and an FPGA or SoC doing the demodulation. Very little of it is exotic — it is closer to consumer radio hardware than to space optics.",x:"A long thin antenna, an amplifier, and a small computer that does the listening."},whyChosen:{e:"It is the only payload here that works equally well over open ocean, at night, and through cloud, because it does not care about light at all. It is also low power and generates modest data volumes — decoded messages are tiny compared to images.",x:"It works over the middle of the ocean, at night, and through clouds, because it does not need light at all. And the messages it collects are small, so they are easy to send home."},tradeoffs:{strengths:[{e:"Weather- and light-independent; tiny data volume.",x:"Works any time, and sends home small files."},{e:"Reprogrammable in orbit — the mission can change after launch.",x:"You can teach it new tricks while it is flying."},{e:"Low pointing requirement: a broad antenna pattern is often enough.",x:"It does not need to aim carefully."}],limits:[{e:"Message collision in dense shipping lanes limits detection rate.",x:"In busy places, so many ships talk at once that some get missed."},{e:"Only sees things that choose to broadcast — a ship with its transponder off is invisible.",x:"If a ship turns its radio off, you cannot hear it."},{e:"Deployable antennas are a mechanism, and mechanisms are what fail.",x:"The antenna has to unfold, and unfolding things can jam."}]},facts:[{label:"Real system",value:"Spire Lemur-2 (3U, ~4.6 kg) flies SENSE (AIS) plus an ADS-B receiver and STRATOS GNSS"},{label:"Fleet",value:"100+ Lemur satellites operating at 400–600 km"}],flown:"Spire Global Lemur-2 constellation",sources:["eo-spire"],tags:["payload:sdr","need:pointing-loose","need:low-data","need:deployable-antenna","cap:listens-radio","cap:all-weather"]},{id:"gnss-ro",level:"both",name:{e:"GNSS radio occultation receiver",x:"Bendy-radio weather sensor"},blurb:{e:"Measures how GPS signals bend through the atmosphere to profile it.",x:"Watches GPS signals bend through the air to measure the weather."},how:{e:"As a GPS satellite sets behind Earth’s limb from your point of view, its signal grazes deeper and deeper through the atmosphere. Denser, wetter air bends the ray more. By timing the phase delay precisely as the geometry changes, you can invert the bending profile into temperature, pressure and humidity versus altitude — a vertical sounding, self-calibrating and cloud-proof.",x:"Radio signals bend when they pass through air, and they bend more through thick or damp air. The satellite watches a GPS signal slide down behind the Earth and measures how much it bends, which tells it what the air is like all the way up."},madeOf:{e:"High-gain limb-pointing antennas fore and aft, a precision GNSS receiver and a very stable clock. The instrument is mostly signal processing; the physics does the calibration for you.",x:"Two antennas pointing forward and backward, a very accurate GPS receiver and a very good clock."},whyChosen:{e:"Radio occultation data is exceptionally valuable to weather forecast models because it needs no on-orbit calibration — the measurement is a time delay, traceable to an atomic clock. It works through cloud, at night, over ocean.",x:"Weather forecasters love this data because it never needs adjusting — it measures time, and clocks do not drift the way cameras do."},tradeoffs:{strengths:[{e:"Self-calibrating, all-weather, day and night.",x:"Always works, and never needs fixing."},{e:"Small data volume and modest power.",x:"Small files, not much electricity."}],limits:[{e:"You get profiles at scattered occultation points, not a continuous image — coverage is statistical.",x:"You get readings in scattered spots, not a whole picture."},{e:"Needs precise orbit determination and timing, which pushes work onto the brain and ADCS.",x:"You must know exactly where your satellite is, very precisely."},{e:"Cannot see the ground itself.",x:"It cannot take pictures of the ground."}]},facts:[{label:"Real system",value:"Spire STRATOS GNSS receiver: radio occultation for weather models, plus precise orbit determination"},{label:"Bus",value:"3U CubeSat, ~4.6 kg"}],flown:"Spire Lemur-2; COSMIC-2 flies the same technique on larger satellites",sources:["eo-spire"],tags:["payload:gnss-ro","need:pointing-moderate","need:low-data","need:precise-timing","cap:profiles-atmosphere","cap:all-weather"]},{id:"particle-telescope",level:"both",name:{e:"Energetic particle telescope / X-ray spectrometer",x:"Space-storm counter"},blurb:{e:"Counts and sorts high-energy particles or measures solar X-ray flares.",x:"Counts the tiny fast bits the Sun throws at us."},how:{e:"A stack of solid-state silicon detectors sits behind a collimator. A particle entering along the accepted direction deposits energy in successive layers; the pattern of deposits identifies both the particle type and its energy. An X-ray spectrometer instead uses a silicon drift detector to record the energy of each arriving photon, building a spectrum one photon at a time.",x:"It is a stack of thin detector layers. When a fast particle from the Sun crashes through, each layer feels a little of the hit, and the pattern tells the satellite what it was and how fast it was going."},madeOf:{e:"Silicon detector wafers, a tungsten or tantalum collimator and shielding to reject particles arriving from the wrong direction, and low-noise charge-sensitive amplifiers.",x:"Thin slices of silicon plus a heavy metal tube that blocks anything coming from the wrong direction."},whyChosen:{e:"This is the classic instrument class that made CubeSats scientifically respectable: CSSWE and MinXSS both produced peer-reviewed results from 3U university builds. Particle instruments are small, low-data and do not need pointing accuracy in the imaging sense.",x:"Student teams have flown these and made real scientific discoveries with them — proof that a tiny satellite can do serious science."},tradeoffs:{strengths:[{e:"Genuinely achievable science from a 3U student build.",x:"A school team can really do this."},{e:"Tiny data volume; no imaging-grade pointing needed.",x:"Small files, no need to aim precisely."}],limits:[{e:"The instrument sits in the radiation it measures, so the electronics degrade over the mission.",x:"The same radiation it measures slowly damages it."},{e:"Measures only along your own orbit track — you learn about where you are, not the whole planet at once.",x:"It only knows about the space it is flying through right now."},{e:"Shielding is dense, and density is mass.",x:"The metal shield is heavy."}]},facts:[{label:"Real instrument",value:"REPTile on CSSWE (3U) — a miniature version of the REPT instrument flown on NASA’s Van Allen Probes"},{label:"Real mission",value:"MinXSS-1 soft X-ray spectrometer, 3U, operated 2016-05-16 to 2017-05-06"},{label:"Team",value:"CSSWE involved more than 65 CU Boulder students"}],flown:"CSSWE (2012), MinXSS-1 and MinXSS-2",sources:["eo-csswe","eo-minxss"],tags:["payload:particles","need:pointing-loose","need:low-data","need:rad-tolerance","cap:detects-particles"]},{id:"ka-radar",level:"engineer",name:{e:"Ka-band precipitation radar",x:"Storm X-ray machine"},blurb:{e:"An active radar that transmits and listens for the echo from raindrops.",x:"Shouts at a storm and listens for the echo."},how:{e:"Unlike every other payload here, this one is active: it transmits a pulse and measures the echo from precipitation, so it builds a vertical profile of what is inside a cloud. Ka-band is short enough in wavelength that raindrops scatter strongly, which is what lets the antenna be small enough to fold into a CubeSat.",x:"Instead of just looking, it shouts a radio pulse at a cloud and listens for the echo bouncing off the raindrops inside. That tells it where the rain is, not just where the cloud is."},madeOf:{e:"A deployable parabolic mesh reflector, a transmitter chain and a receiver. JPL’s RainCube proved a 6U could carry the whole thing — the antenna folds into a fraction of a unit and unfurls in orbit.",x:"A folding dish antenna that opens up like an umbrella once it is in space, plus a radio transmitter."},whyChosen:{e:"It is the only way to see the internal structure of a storm rather than its cloud top, and it works at night. RainCube existed largely to prove miniaturised radar was possible at all.",x:"It is the only tool here that can see inside a storm instead of just looking at the top of the clouds."},tradeoffs:{strengths:[{e:"Sees inside precipitation; works day and night, through cloud.",x:"Sees inside storms, day or night."},{e:"Proven at 6U scale.",x:"Already been done on a small satellite."}],limits:[{e:"Active transmission is by far the largest power draw of any payload here.",x:"Uses a lot of electricity because it has to shout."},{e:"Requires a deployable antenna — the highest-risk mechanism on the spacecraft.",x:"Needs a folding dish, and folding things can get stuck."},{e:"Will not fit a 1U or 3U; 6U minimum.",x:"Too big for a small satellite."}]},facts:[{label:"Real mission",value:"NASA JPL RainCube — 6U CubeSat with a deployable Ka-band radar antenna"},{label:"Band",value:"Ka-band: 27–40 GHz"}],flown:"RainCube (deployed from the ISS, 2018)",sources:["jpl-raincube","soa-comms"],tags:["payload:radar","need:high-power","need:volume-6u","need:deployable-antenna","need:pointing-moderate","need:medium-data","cap:sees-inside-storms","cap:all-weather"]}]},sp={id:"structure",order:3,code:"STR",name:{e:"Structure & Mechanisms",x:"The Frame"},subtitle:{e:"The chassis everything else bolts to",x:"The skeleton that holds it all together"},question:{e:"What form factor and frame will you build?",x:"How big will your satellite be?"},primer:{e:"A CubeSat’s structure has three jobs: survive launch, define the interface with the deployer, and give every other subsystem somewhere to mount. The unit — 1U — is a 10 cm cube, and sizes stack from there. The rails along the corners are the only part that touches the deployer, so they are machined to tight tolerance and hard-anodised so aluminium does not cold-weld to aluminium in vacuum.",x:'The frame is the skeleton. It has to survive the rocket ride, which shakes harder than anything on Earth, and it has to fit exactly inside the launcher tube. One "U" is a 10 cm cube — about the size of a large apple — and you can stack them.'},realTalk:{e:"NASA’s CubeSat Launch Initiative requires CubeSats to survive a GEVS random-vibration environment of approximately 10 Grms over a two-minute period. That test, not orbit, is what breaks most first-time hardware.",x:"Before it flies, your satellite gets strapped to a shaker table and rattled hard for two minutes. That is the test that breaks most first satellites — not space itself."},sources:["cds","soa-struct","cubesat101"],options:[{id:"1u",level:"both",name:{e:"1U — a single 10 cm cube",x:"1U — one little cube"},blurb:{e:"The original unit. Minimum viable spacecraft.",x:"The smallest kind — about the size of a big apple."},how:{e:"A skeletonised aluminium frame with four corner rails and internal mounting features. Boards usually stack on the PC/104 pattern with standoffs, so the electronics themselves become part of the structural load path.",x:"A little metal cage with four rails at the corners. The circuit boards stack up inside like a sandwich, held apart by little posts."},madeOf:{e:"Machined aluminium 6061-T6 or 7075. The rails are hard-anodised: bare aluminium sliding on bare aluminium in vacuum can cold-weld, which would jam you in the deployer.",x:"Made from aluminium, with a special hard coating on the rails so it does not stick inside the launcher tube."},whyChosen:{e:"Cheapest to build, cheapest to launch, and small enough that a school team can actually finish it. If your payload is a particle detector or a radio, 1U is genuinely enough.",x:"Cheap, quick to build, and a small team can actually finish one. If your job is listening or counting, this is plenty big."},tradeoffs:{strengths:[{e:"Lowest cost and shortest build schedule.",x:"Cheapest and fastest to build."},{e:"Widest choice of rideshare slots.",x:"Easiest to find a rocket for."}],limits:[{e:"Very little internal volume once the bus is installed — often under half a unit for payload.",x:"Almost no room left inside once you add the batteries and computer."},{e:"Small surface area caps body-mounted solar power hard.",x:"Not much room for solar panels."},{e:"No space for optics with a meaningful focal length.",x:"Not enough room for a good telescope."}]},facts:[{label:"Dimensions",value:"100 × 100 × 113.5 mm (NASA SoA)"},{label:"Standard",value:"Cal Poly CubeSat Design Specification Rev. 14.1"}],flown:"Hundreds of university 1U missions since 2003",sources:["soa-struct","cds"],tags:["struct:1u","struct:tiny","struct:low-area"]},{id:"3u",level:"both",name:{e:"3U — three units in a row",x:"3U — three cubes in a line"},blurb:{e:"The most-flown CubeSat size. A loaf of bread with solar panels.",x:"About the size of a loaf of bread. The most common size."},how:{e:"The same rail architecture stretched to 340.5 mm. The extra length lets you put the payload at one end and the bus at the other, which physically separates a sensitive instrument from noisy power electronics and gives you a longer optical path.",x:"Same idea as 1U, just three times as long. That means you can put the job-tool at one end and all the boring bits at the other, so they do not get in each other’s way."},madeOf:{e:"Aluminium 6061 or 7075 frame; increasingly with carbon-fibre or additively manufactured secondary structure to save mass.",x:"Aluminium, sometimes with lightweight carbon fibre parts."},whyChosen:{e:"It is the sweet spot: enough volume and surface area for a real instrument, deployable panels and a proper ADCS, while still being a cheap, standard rideshare. Planet, Spire and most commercial CubeSat operators standardised on it.",x:'It is the "just right" size — big enough to do a real job, small enough to stay cheap. Most real satellite companies use this size.'},tradeoffs:{strengths:[{e:"Enough room for a real payload plus a full bus.",x:"Room for a proper tool and everything it needs."},{e:"Long axis gives a useful focal length for optics and a gravity-gradient-friendly shape.",x:"Being long helps cameras focus and helps it hang steady."},{e:"By far the best-supported size for off-the-shelf parts.",x:"You can buy ready-made parts for this size."}],limits:[{e:"Still tight for anything needing a deployable dish or a cryocooler.",x:"Still too small for a folding dish or a fridge."},{e:"Body-mounted solar alone will not power a demanding payload.",x:"Needs fold-out solar panels for hungry tools."}]},facts:[{label:"Dimensions",value:"100 × 100 × 340.5 mm (NASA SoA)"},{label:"Real example",value:"Planet Dove: 3U, ~5.2 kg launch mass; Spire Lemur-2: 3U, ~4.6 kg"}],flown:"Planet Dove, Spire Lemur-2, CSSWE, MinXSS, FOREST-1",sources:["soa-struct","eo-planet","eo-spire"],tags:["struct:3u","struct:medium","struct:long-axis"]},{id:"6u",level:"both",name:{e:"6U — two rows of three",x:"6U — six cubes, like a shoebox"},blurb:{e:"The size where deployable dishes, cryocoolers and propulsion start to fit.",x:"A shoebox-sized satellite that can carry big equipment."},how:{e:"A wider, flatter box, usually with a large flat face that suits a folding solar wing or a deployable antenna. The wider cross-section also gives you somewhere to put a radiator that is not competing with solar cells.",x:"A wider, flatter box. The big flat side is perfect for folding out large solar wings or an antenna dish."},madeOf:{e:"Machined aluminium, frequently combined with composite panels; multifunctional structures that double as thermal paths are commercially available in 6U (for example Thermal Management Technologies’ SPOT structures).",x:"Aluminium plus lightweight panels. Some frames are cleverly built to also carry heat away from hot parts."},whyChosen:{e:"Chosen when the instrument demands it: RainCube needed 6U for its deployable radar antenna, Lunar IceCube needed it for a cryocooled spectrometer, BioSentinel needed it for biology hardware. MarCO flew 6U to Mars.",x:"You go to this size when your tool simply will not fit in anything smaller — like a folding dish or a fridge."},tradeoffs:{strengths:[{e:"Fits deployable antennas, cryocoolers, and real propulsion.",x:"Room for dishes, fridges and rocket engines."},{e:"More surface area for both power generation and heat rejection.",x:"More room for solar panels and for getting rid of heat."}],limits:[{e:"Materially more expensive to build and to launch.",x:"Costs a lot more."},{e:"Fewer rideshare slots than 3U; more scheduling risk.",x:"Harder to find a ride."},{e:"A bigger structure means more mass to point, so ADCS actuators grow too.",x:"Heavier, so it needs stronger equipment to turn it."}]},facts:[{label:"Dimensions",value:"100 × 226.3 × 366 mm (NASA SoA)"},{label:"Real missions",value:"RainCube, MarCO, BioSentinel, Lunar IceCube, TechEdSat-10"}],flown:"MarCO-A and MarCO-B relayed InSight’s Mars landing telemetry in 2018",sources:["soa-struct","nasa-marco","jpl-raincube"],tags:["struct:6u","struct:large","struct:high-area"]},{id:"12u",level:"engineer",name:{e:"12U — the top of the CubeSat class",x:"12U — the biggest cube-satellite"},blurb:{e:"Where CubeSats stop being small and start being small spacecraft.",x:"A big one — nearly a microwave oven."},how:{e:"A 226.3 mm square cross-section, 366 mm long. At this scale the PC/104 board stack stops being the organising principle and the design starts to look like a conventional spacecraft with panels, harness runs and dedicated equipment decks.",x:"Big enough that it stops being built like a stack of circuit boards and starts being built like a proper spaceship, with separate rooms for different parts."},madeOf:{e:"Machined aluminium primary structure with composite or honeycomb panels; conventional aerospace practice at reduced scale.",x:"Aluminium frame with light stiff panels, built like a real spacecraft."},whyChosen:{e:"Chosen for missions that genuinely need power and propellant: CAPSTONE was a 12U, roughly 25 kg CubeSat that flew to a lunar near-rectilinear halo orbit using pump-fed hydrazine.",x:"You need this size for missions that go really far, like to the Moon, because you need lots of fuel and power."},tradeoffs:{strengths:[{e:"Enough power and propellant volume for interplanetary or cislunar missions.",x:"Can carry enough fuel to leave Earth orbit."},{e:"Room for redundant systems.",x:"Room for spare parts in case something breaks."}],limits:[{e:"Cost approaches that of a small conventional satellite, eroding the CubeSat cost argument.",x:"So expensive it stops being a cheap satellite."},{e:"Limited deployer availability.",x:"Very few rockets can launch it."}]},facts:[{label:"Dimensions",value:"226.3 × 226.3 × 366 mm (NASA SoA)"},{label:"Real mission",value:"CAPSTONE: 12U, 25 kg, pump-fed hydrazine, launched June 2022 on Rocket Lab Electron"}],flown:"CAPSTONE (lunar)",sources:["soa-struct","soa-prop"],tags:["struct:12u","struct:large","struct:high-area"]}]},ip={id:"power",order:4,code:"EPS",name:{e:"Power — Solar Arrays & EPS",x:"Making Electricity"},subtitle:{e:"Turning sunlight into every watt the spacecraft will ever use",x:"Catching sunshine and turning it into power"},question:{e:"How will you generate power?",x:"How will your satellite make electricity?"},primer:{e:"A satellite has no fuel line and no plug. Everything it does for its whole life comes from sunlight hitting solar cells. In low Earth orbit you get roughly 90-minute laps, and you spend a large part of each one in Earth’s shadow, so the array has to generate not just what you use in daylight but also everything the battery must store for the dark half.",x:"There is no plug socket in space. Every bit of electricity your satellite will ever use has to come from sunlight. And it goes round Earth so fast that it passes into Earth’s shadow about sixteen times a day — so it also has to make extra power to save up for the dark bits."},realTalk:{e:"Space solar cells are not the silicon panels on a house roof. They are multi-junction III-V semiconductor stacks: several sub-cells layered so each one absorbs a different slice of the spectrum, reaching efficiencies household silicon cannot approach.",x:"Space solar cells are special. Instead of one layer, they have several layers stacked up, each catching a different colour of sunlight — so they waste much less of it."},sources:["soa-power"],options:[{id:"body-mounted",level:"both",name:{e:"Body-mounted cells",x:"Panels stuck on the sides"},blurb:{e:"Cells bonded directly to the satellite’s outside faces. Nothing to deploy, nothing to fail.",x:"Solar cells glued straight onto the satellite’s walls."},how:{e:"Multi-junction cells are bonded to the outer panels and wired into strings. Because the faces point in fixed directions, only the ones currently facing the Sun generate anything, and they lose output by the cosine of the angle — a face 60° off the Sun gives you half its rated power.",x:"The cells are glued straight onto the outside walls. Only the walls facing the Sun make power, and the more sideways they are, the less they make."},madeOf:{e:"Triple-junction gallium arsenide cells (typically ~29–32% efficient) with a coverglass, bonded to a printed circuit board or aluminium substrate.",x:"Special layered solar cells with a glass cover, stuck onto a stiff board."},whyChosen:{e:"It is the only option with no deployment event, which removes an entire class of mission-ending failure. For a low-power payload — a radio receiver, a particle detector — it is genuinely sufficient, and it is what you fly if reliability matters more than watts.",x:"Nothing has to unfold, so nothing can get stuck. If your satellite does not need much power, this is the safest choice by far."},tradeoffs:{strengths:[{e:"No mechanism, so no deployment failure mode.",x:"Nothing to unfold, nothing to jam."},{e:"No deployment torque disturbing attitude; simple, compact, cheap.",x:"Simple and cheap."}],limits:[{e:"Power scales with the small outside area of the satellite — the hard ceiling on this option.",x:"A small satellite has small walls, so you only get a little power."},{e:"Cosine losses: most of your cells are pointing the wrong way at any moment.",x:"Most of the cells are facing away from the Sun most of the time."},{e:"Cells compete for the same faces as radiators, antennas and instrument apertures.",x:"The walls are crowded — cameras and antennas want that space too."}]},facts:[{label:"Cell efficiency",value:'NASA SoA: space multi-junction cells reach "spectral efficiencies of 30-34%"'},{label:"Examples",value:"AZUR Space 3G30-Adv 29.5%; Rocket Lab ZTJ Omega 30.2%; Boeing-Spectrolab XTE-SF 32.2%"}],flown:"Standard on 1U university CubeSats and on low-power 3U buses",sources:["soa-power"],tags:["power:body","power:low","power:no-deployable","power:reliable"]},{id:"deployable-fixed",level:"both",name:{e:"Deployable fixed panels",x:"Fold-out wings"},blurb:{e:"Hinged panels that spring open once clear of the deployer. The standard answer.",x:"Panels folded flat that pop open in space, like wings."},how:{e:"Panels are folded against the body and held by a hold-down — commonly a nylon cord cut by a burn-wire resistor. When the flight computer passes current through the resistor it melts the cord, and torsion springs in the hinges swing the panels out and latch them. They then stay in a fixed geometry relative to the body.",x:"The panels are folded up and tied down with a string. In space, the computer heats a little wire until the string melts, and springs flick the wings open with a click."},madeOf:{e:"Same triple-junction cells, on rigid PCB, carbon-fibre or aluminium-honeycomb substrates, with spring-loaded hinges and a burn-wire or pin-puller release.",x:"The same special solar cells, mounted on stiff lightweight boards, with springy hinges."},whyChosen:{e:"This is the pragmatic middle: it multiplies your collecting area several times over for one mechanism and no ongoing power cost. Almost every imaging or radar CubeSat flies deployables because body-mounted power simply cannot feed them.",x:"You get several times more power for one unfolding. Almost every camera satellite does this, because sticking panels on the walls just does not make enough electricity."},tradeoffs:{strengths:[{e:"Several times the area of body-mounted for modest mass.",x:"Much more power, not much more weight."},{e:"Once deployed, no moving parts and no standby power.",x:"After it opens, nothing else moves or uses power."}],limits:[{e:"One-shot mechanism: a failed deployment usually ends the mission.",x:"If the wings do not open, the mission is over."},{e:"Large panels increase drag and give the atmosphere more leverage to twist you.",x:"Big wings catch the thin air and push the satellite around."},{e:"Panels can shadow the instrument or the antenna depending on geometry.",x:"The wings can get in the camera’s way."}]},facts:[{label:"Specific power",value:"NASA SoA: triple/quadruple deployable configurations offer 34–70 W/kg"},{label:"Typical",value:'Missions cluster "around ~30 W/kg" specific power'}],flown:"Planet Dove, Spire Lemur-2, most 3U and 6U commercial CubeSats",sources:["soa-power"],tags:["power:deployable","power:medium","power:has-deployable","power:drag"]},{id:"articulated",level:"engineer",name:{e:"Deployable + sun-tracking (articulated) arrays",x:"Wings that turn to follow the Sun"},blurb:{e:"Motorised wings that rotate to hold the Sun square on. Maximum power, maximum complexity.",x:"Wings on little motors that keep turning to face the Sun."},how:{e:"After deployment, a solar array drive assembly rotates the wings on one or two axes, using sun-sensor feedback so the cells stay near normal incidence regardless of how the body is pointed. This decouples power generation from attitude — the instrument can stare at the ground while the wings keep facing the Sun.",x:"After the wings open, little motors keep turning them so they always face the Sun — even while the satellite itself is looking down at Earth."},madeOf:{e:"Deployable substrates plus a solar array drive assembly: a small geared motor, slip rings or a twist capsule to pass current across the rotating joint, and position feedback.",x:"Fold-out panels plus a little motor and a clever electrical joint that lets power flow across a spinning connection."},whyChosen:{e:'Chosen when the payload is power-hungry and simultaneously demands a fixed pointing direction — an active radar, a high-rate transmitter, or electric propulsion. It removes the conflict between "point at the target" and "point at the Sun".',x:"You need this when your tool must stare at one thing while the satellite still needs lots of power. Otherwise you would have to choose between looking and charging."},tradeoffs:{strengths:[{e:"Highest and most consistent power generation available at CubeSat scale.",x:"The most electricity you can get."},{e:"Frees the spacecraft to point the payload wherever it needs.",x:"The satellite can look anywhere and still charge."}],limits:[{e:"A continuously operating mechanism with slip rings — a real wear and lifetime item.",x:"The motor keeps running, and things that keep moving eventually wear out."},{e:"The drive consumes power and injects jitter, which can blur a sensitive instrument.",x:"The motor shakes the satellite slightly, which can blur pictures."},{e:"Most complex and expensive option, and rarely justified below 6U.",x:"Complicated and expensive — usually only on bigger satellites."}]},facts:[{label:"Specific power",value:"NASA SoA lists multi-deployable configurations at 34–70 W/kg"},{label:"PMAD efficiency",value:"Power management systems typically 85–99% efficient (e.g. Pumpkin AMPS at 99%)"}],flown:"Common on ESPA-class small satellites; used on the larger CubeSat platforms",sources:["soa-power"],tags:["power:articulated","power:high","power:has-deployable","power:jitter","power:mechanism"]}]},lp={id:"battery",order:5,code:"BAT",name:{e:"Energy Storage — the Battery",x:"The Power Store"},subtitle:{e:"What keeps the spacecraft alive through every eclipse",x:"What keeps it running in the dark"},question:{e:"What will you store energy in?",x:"Where will your satellite keep its power?"},primer:{e:"In low Earth orbit you go into Earth’s shadow roughly sixteen times a day, so the battery is charged and discharged around 5,800 times a year. That is a brutal cycling duty, and it is the reason spacecraft batteries are operated at shallow depth of discharge rather than being run flat. The battery is also the most temperature-sensitive item on the whole vehicle.",x:"Your satellite goes into Earth’s shadow about sixteen times every day. That means the battery gets used and refilled thousands of times a year — so you never drain it all the way, or it wears out fast. Batteries also hate being too cold or too hot."},realTalk:{e:"A battery is also the main safety concern in launch integration: it is the one component with stored energy that can vent, ignite or explode on the pad, so launch providers scrutinise the cell choice, the protection circuitry and the inhibit design closely.",x:"The battery is the part rocket companies worry about most, because it is the only bit that stores enough energy to catch fire. It gets checked very carefully before launch."},sources:["soa-power","cubesat101"],options:[{id:"li-ion-18650",level:"both",name:{e:"Lithium-ion 18650 cells",x:"Chunky round batteries"},blurb:{e:"The cylindrical cell you find in laptops and power tools, flown almost unchanged.",x:"The same kind of battery as in a laptop — and it really goes to space."},how:{e:"Lithium ions shuttle between a graphite anode and a metal-oxide cathode through a liquid electrolyte. The 18650 is a standardised 18 mm × 65 mm steel can, which makes it mechanically robust and easy to hold securely against launch vibration.",x:"Tiny particles called ions travel back and forth inside the battery: one way when it charges, the other way when you use it. The metal can around it is tough, which matters when a rocket is shaking it."},madeOf:{e:"Steel case, graphite anode, lithium metal-oxide cathode, liquid electrolyte, plus a protection board handling cell balancing, over-current and over-discharge cut-off.",x:"A metal can with special chemicals inside, plus a small circuit board that stops it being overcharged or over-drained."},whyChosen:{e:"Enormous terrestrial production makes these cheap, well-characterised and available in flight-screened lots. NASA has real heritage here: LG Chem ICR18650 cells flew on PhoneSat and Europa Clipper, and a Panasonic NCR18650B pack flew on the Mars Ingenuity helicopter.",x:"Because millions are made for laptops, they are cheap and very well understood. NASA has flown them on Mars — the little Ingenuity helicopter used them."},tradeoffs:{strengths:[{e:"Excellent specific energy: commercial Li-ion cells give 150–270 Wh/kg.",x:"Stores a lot of energy for its weight."},{e:"Cheap, available, and with real flight heritage.",x:"Cheap and already proven in space."}],limits:[{e:"Must be kept warm: charging a lithium-ion cell below 0 °C plates lithium metal and permanently damages it.",x:"If it gets too cold, charging it wrecks it — so it needs a heater."},{e:"Capacity fades with cycling; deep discharge accelerates it badly.",x:"It wears out over time, faster if you keep draining it flat."},{e:"A liquid electrolyte in a sealed can is the main fire-safety review item.",x:"It is the part that could catch fire, so it gets checked hard."}]},facts:[{label:"Specific energy",value:'NASA SoA: "Commercial Li-ion energy cells typically provide 150-270 Wh/kg and an average voltage of 3.6 V"'},{label:"Cell examples",value:"Panasonic NCR18650B 243 Wh/kg (Mars Ingenuity); Sony US18650 VTC4 250 Wh/kg"},{label:"Cycle life",value:"NASA SoA lists Li-ion at 2,000–70,000 cycles depending on use"}],flown:"NASA PhoneSat, Europa Clipper, Mars Ingenuity",sources:["soa-power"],tags:["bat:liion","bat:high-energy","bat:needs-heater","bat:cold-sensitive"]},{id:"lipo-pouch",level:"both",name:{e:"Lithium-polymer pouch cells",x:"Flat squishy batteries"},blurb:{e:"Flat, flexible cells that fit awkward gaps. Lower energy, easier packaging.",x:"Flat batteries that can be tucked into odd spaces."},how:{e:"Same lithium chemistry, but with a gel or solid polymer electrolyte in a foil pouch instead of a rigid can. Without a steel case the cell can be made thin and shaped to fit, but it also has no structural protection of its own.",x:"Same idea as the round ones, but wrapped in foil instead of metal, so they can be flat and thin. That means they fit in gaps — but they are also easier to damage."},madeOf:{e:"Aluminised foil pouch, gel or solid polymer electrolyte, lithium electrodes. Flight designs need a rigid retention frame and compression control, because pouch cells swell as they age.",x:"Foil packets with special jelly inside. They need a frame around them, because they puff up slightly as they get old."},whyChosen:{e:"Chosen for volume-constrained builds where a cylindrical cell simply will not fit, and where the packaging win outweighs the lower energy density.",x:"Picked when there is just no room for round batteries and you need something that fits a thin gap."},tradeoffs:{strengths:[{e:"Packs into thin or irregular volumes a cylindrical cell cannot use.",x:"Fits into flat spaces."},{e:"Lighter casing than a steel can.",x:"Lighter, because there is no metal can."}],limits:[{e:"Lower specific energy than Li-ion: NASA SoA puts LiPo at 150–200 Wh/kg.",x:"Stores less energy for the same weight."},{e:"Shorter cycle life than cylindrical Li-ion.",x:"Wears out sooner."},{e:"Swelling and puncture risk demand careful mechanical design.",x:"They puff up and can be punctured, so they must be held safely."}]},facts:[{label:"Specific energy",value:'NASA SoA: LiPo cells "deliver a lower energy density (150-200 Wh/kg)"'},{label:"Cycle life",value:'NASA SoA describes LiPo cycle life as "shorter" than Li-ion'}],flown:"Widely used in commercial CubeSat EPS modules",sources:["soa-power"],tags:["bat:lipo","bat:medium-energy","bat:needs-heater","bat:cold-sensitive","bat:compact"]},{id:"lifepo4",level:"engineer",name:{e:"Lithium iron phosphate (LiFePO₄)",x:"The tough, safe battery"},blurb:{e:"Trades energy density for thermal stability and cycle life.",x:"Holds less power, but is much harder to damage."},how:{e:"The cathode uses an iron phosphate olivine structure with very strong phosphorus–oxygen bonds. It does not release oxygen when overheated the way a metal-oxide cathode can, so it will not sustain thermal runaway in the same way — the failure mode that makes launch providers nervous.",x:"The chemicals inside are held together much more tightly, so if it gets too hot it does not catch fire the way other lithium batteries can."},madeOf:{e:"Iron phosphate cathode, graphite anode, liquid electrolyte, in cylindrical or prismatic cells. Flat discharge voltage curve around 3.2 V.",x:"Iron and phosphorus based chemicals instead of the usual ones — cheaper metals, and much more stable."},whyChosen:{e:"Picked when cycle life and safety dominate: a long-duration mission that will see tens of thousands of eclipse cycles, or a build where the launch safety review is the binding constraint.",x:"Chosen for satellites that need to last a very long time, or when safety matters more than squeezing in every last bit of power."},tradeoffs:{strengths:[{e:"Much better thermal stability — a far gentler failure mode.",x:"Far less likely to catch fire."},{e:"Long cycle life at deeper depth of discharge than Li-ion tolerates.",x:"Can be used harder for longer without wearing out."}],limits:[{e:"Noticeably lower specific energy — you carry more mass for the same stored energy.",x:"Heavier for the same amount of power stored."},{e:"Lower cell voltage (~3.2 V) means more cells in series for the same bus voltage.",x:"You need more of them to reach the right voltage."}]},facts:[{label:"Use in flight hardware",value:"NASA SoA lists LiFePO₄ in products such as the Dragonfly Aerospace 28-300 module and SkyLabs SKY-NANOeps-BMM"}],flown:"Used in several commercial nanosatellite EPS products",sources:["soa-power"],tags:["bat:lifepo4","bat:low-energy","bat:safe","bat:long-life","bat:cold-tolerant"]},{id:"supercap-hybrid",level:"engineer",name:{e:"Battery + supercapacitor hybrid",x:"Battery with a burst tank"},blurb:{e:"A small battery for endurance plus supercapacitors for short, violent power spikes.",x:"A normal battery plus something that can dump power very fast."},how:{e:"Supercapacitors store charge electrostatically at an electrode surface rather than through a chemical reaction, so they charge and discharge almost instantly and survive effectively unlimited cycles. They pair with a battery: the battery carries the average load, the capacitor bank absorbs the pulse.",x:"A normal battery is like a water tank with a thin pipe — steady but slow. A supercapacitor is a small tank with a huge pipe: it empties in a flash. Using both gives you steady power and sudden bursts."},madeOf:{e:"Battery cells plus an electric double-layer capacitor bank, with power management deciding what draws from which.",x:"A battery plus special fast capacitors, and a small circuit that decides which one to use."},whyChosen:{e:"Chosen for pulsed loads: a radar transmit pulse, a high-power burst downlink, a pulsed plasma thruster. Without the capacitor bank, those pulses would force you to oversize the whole battery just to handle peak current.",x:"Used when the satellite needs a huge burst of power for a moment — like a radar pulse. Otherwise you would need a much bigger battery just for those flashes."},tradeoffs:{strengths:[{e:"Very high power density and effectively unlimited cycle life.",x:"Can give a huge burst, over and over, forever."},{e:"Protects the battery from damaging peak currents.",x:"Saves the main battery from being strained."}],limits:[{e:"Very poor energy density — a supercapacitor cannot store much for its mass.",x:"It cannot hold much energy at all."},{e:"Self-discharges quickly, so it cannot be a primary store.",x:"It leaks its charge away, so it cannot be your main battery."},{e:"Adds another power-management path to design and test.",x:"Adds complexity."}]},facts:[{label:"Energy",value:'NASA SoA: recent supercapacitors reach "60 Wh/kg" (previously ~7 Wh/kg)'},{label:"Power / cycles",value:'"very high power densities (10–100 kW/kg)" and "over 1 million cycles"'}],flown:"Emerging; used for pulsed-load small spacecraft applications",sources:["soa-power"],tags:["bat:supercap","bat:pulse","bat:low-energy","bat:long-life"]}]},up={id:"brain",order:6,code:"CDH",name:{e:"Brain — Command & Data Handling",x:"The Brain"},subtitle:{e:"The onboard computer, and the radiation problem it has to survive",x:"The computer that runs everything"},question:{e:"What will you use as your flight computer?",x:"What kind of computer will run your satellite?"},primer:{e:"The onboard computer runs the flight software, sequences everything the satellite does, collects payload data, keeps the clock, and decides what to do when something goes wrong. The unusual part is the environment: outside the atmosphere and the magnetosphere’s protection, charged particles pass straight through silicon. Two things happen. Total ionising dose builds up slowly and degrades transistors permanently, measured in krad. Single-event effects are instantaneous: a passing particle flips a memory bit (an upset) or, worse, triggers a short-circuit-like conducting path (a latch-up) that can destroy the chip if power is not removed fast.",x:"The brain is the computer that tells every other part what to do. Space is a hard place for computers, because tiny invisible bullets from the Sun and from deep space go straight through the chips. Sometimes they just flip a 1 into a 0. Sometimes they cause a short circuit that can burn the chip out unless the satellite notices and switches it off quickly."},realTalk:{e:'The choice here is not really "which chip is fastest" — it is how much you trust software and circuit tricks to catch radiation faults versus how much you pay for silicon that does not have them in the first place.',x:"The real question is not which computer is fastest. It is whether you buy an expensive tough chip, or a cheap one plus a clever plan for when it goes wrong."},sources:["soa-avionics"],options:[{id:"cots-mcu",level:"both",name:{e:"COTS microcontroller (ARM Cortex-M class)",x:"An ordinary small computer chip"},blurb:{e:"An off-the-shelf embedded microcontroller with a watchdog and a hard reset plan.",x:"A normal little chip, plus a plan for when space breaks it."},how:{e:"A commercial ARM Cortex-M runs a small real-time operating system such as FreeRTOS. Protection is architectural rather than material: an independent watchdog timer resets the processor if the software stops petting it, current-limiting circuitry detects a latch-up as an over-current event and power-cycles the rail, and critical memory is protected with error-detection-and-correction codes.",x:'You use a normal chip like the ones in a robot kit, and then add a guard: a simple timer that resets the computer if it stops saying "I am fine", and a circuit that cuts the power if the chip suddenly starts drawing too much.'},madeOf:{e:"Standard commercial silicon on a PC/104-format board, with an external watchdog IC, latch-up protection, and often a rad-tolerant supervisory circuit as the one hardened part.",x:"A normal circuit board with a normal chip and a couple of small protective parts."},whyChosen:{e:"It is cheap, it is fast to develop for, and hundreds of student CubeSats have proved that a well-watchdogged commercial part survives a one- to two-year LEO mission perfectly well. In LEO you are still partly shielded by Earth’s magnetic field.",x:"It is cheap and easy to program, and hundreds of school satellites have shown it works fine for a year or two."},tradeoffs:{strengths:[{e:"Lowest cost, fastest development, huge tool and library ecosystem.",x:"Cheap, and easy to write programs for."},{e:"Adequate for short LEO missions with good fault handling.",x:"Good enough for a short mission close to Earth."}],limits:[{e:"Low total ionising dose tolerance — degradation accumulates over a long mission.",x:"Slowly gets damaged, so it will not last many years."},{e:"Resets cost you data and observation time.",x:"Every time it restarts, you lose whatever it was doing."},{e:"Poor choice for high-radiation orbits or anything beyond Earth.",x:"A bad idea for the Moon or Mars."}]},facts:[{label:"Typical TID",value:"NASA SoA lists commercial CubeSat OBCs around 20–40 krad (AAC Sirius 20 krad; EnduroSat OBC I 40 krad)"},{label:"Protection",value:'NASA SoA: "Watchdog timers, selective power cycling, and software-based fault isolation—can improve robustness."'},{label:"Software",value:"FreeRTOS is the common lightweight kernel; NASA’s open-source cFS is used from CubeSat to flagship"}],flown:"The overwhelming majority of university CubeSats",sources:["soa-avionics","nasa-cfs"],tags:["cdh:cots","cdh:low-power","cdh:low-rad","cdh:cheap","cdh:low-compute"]},{id:"cots-soc-fpga",level:"both",name:{e:"COTS SoC / FPGA (Xilinx Zynq class)",x:"A powerful chip that can rewire itself"},blurb:{e:"A processor and reconfigurable logic on one die — enough compute to process data before you send it.",x:"A strong chip that can change its own wiring to do special jobs fast."},how:{e:"A system-on-chip pairs ARM processor cores with FPGA fabric — logic gates whose interconnections are defined by a configuration file, so you build custom hardware in software. That makes it excellent at the things a general CPU is bad at: image compression, signal demodulation, running a neural network on a video frame. The fabric’s configuration memory is itself radiation-sensitive, so flight designs continuously scrub it, rewriting the configuration to repair bit flips before they accumulate.",x:"This chip has a normal computer inside plus a special part that can rewire itself into whatever circuit you need — great for squashing pictures or listening to radio. Space particles can scramble that wiring, so the satellite keeps quietly redrawing it to fix any damage."},madeOf:{e:"Commercial Zynq-7000 or UltraScale+ silicon, with ECC-protected memory, configuration scrubbing logic, and latch-up protection on the power rails.",x:"A powerful commercial chip, with extra circuits that keep checking it for mistakes."},whyChosen:{e:"Chosen when downlink is the bottleneck. If you can compress or triage onboard — pick the 3% of frames with a fire in them, decode AIS messages into a few kilobytes of text — you turn an impossible downlink problem into an easy one. D-Orbit ran a neural network onboard in orbit in 2023 doing exactly this kind of work.",x:"You pick this when you cannot send everything home. If the satellite can look at its own pictures and only send the interesting ones, a slow radio suddenly becomes fast enough."},tradeoffs:{strengths:[{e:"Massive onboard processing — makes data reduction and onboard AI possible.",x:"Powerful enough to sort its own data before sending it."},{e:"Reconfigurable in orbit: you can upload new logic, not just new software.",x:"You can change how it works even after launch."}],limits:[{e:"Much higher power draw than a microcontroller, and it is on all the time.",x:"Uses a lot more electricity."},{e:"Configuration memory needs continuous scrubbing; more complex fault management.",x:"Needs constant checking to fix radiation damage."},{e:"FPGA development is a specialist skill and a schedule risk for a student team.",x:"Hard to learn and slow to program."}]},facts:[{label:"TID examples",value:"NASA SoA: GomSpace NanoMind HP MK3 (Xilinx Zynq) >20 krad; Xiphos Q7S (Zynq-7020) 25 krad"},{label:"Onboard AI",value:"NASA SoA: in July 2023 D-Orbit’s ION SCV004 ran the RaVAEn neural network onboard, demonstrating image compression and on-chip few-shot training"}],flown:"GomSpace NanoMind HP, Xiphos Q7S, D-Orbit ION",sources:["soa-avionics"],tags:["cdh:soc","cdh:high-compute","cdh:high-power","cdh:low-rad","cdh:onboard-processing"]},{id:"rad-hard",level:"both",name:{e:"Radiation-hardened processor",x:"A space-toughened chip"},blurb:{e:"Silicon designed and manufactured so radiation faults mostly cannot happen.",x:"A chip specially built so space cannot break it."},how:{e:"Hardening happens at the process and layout level: guard rings and silicon-on-insulator construction make latch-up structurally impossible, memory cells are built with redundant storage nodes so a single strike cannot flip them, and critical logic is triplicated with a voter that takes the majority answer. The result is a chip that shrugs off what would reset a commercial part.",x:"These chips are built differently on purpose. Important circuits are built three times over, and a little judge inside picks whichever answer two of them agree on. So one particle strike cannot fool it."},madeOf:{e:"Purpose-built rad-hard silicon: LEON/SPARC parts such as the GR712RC or GR740, Vorago VA41630, BAE parts. Typically older process nodes, deliberately, because larger transistors hold more charge and are harder to upset.",x:"Chips made in special factories. Funnily enough they use older, chunkier designs on purpose — bigger parts are harder for a space particle to knock over."},whyChosen:{e:"Chosen when a reset is unacceptable or unrecoverable: deep space, high-radiation orbits, long missions, or anything where a fault happens outside ground-station contact and nobody can intervene for hours.",x:"Used when a crash would be a disaster — like a satellite going to the Moon, where nobody can reach it to fix it."},tradeoffs:{strengths:[{e:"Radiation-tested to at least 50 krad TID for the common families; latch-up immune by construction.",x:"Survives radiation that would break a normal chip."},{e:"Predictable real-time behaviour and long mission life.",x:"Reliable for many years."}],limits:[{e:"Dramatically more expensive — often more than the rest of the bus combined.",x:"Extremely expensive."},{e:"Far slower than contemporary commercial silicon; a phone outruns it easily.",x:"Much slower than a normal computer."},{e:"Long lead times and export-control paperwork.",x:"Hard to buy and slow to arrive."}]},facts:[{label:"Devices",value:"Vorago VA10820/VA41620/VA41630, Cobham GR740, BAE 5545 — all radiation tested to at least 50 krad TID"},{label:"Flown part",value:'NASA SoA lists the "GR712RC dual-core 32-bit LEON3 fault-tolerant, SPARC V8 processor" on a CubeSat entry'},{label:"High-reliability",value:'Aitech SP0-S rated at "100 krad TID"'}],flown:"Standard on NASA science missions; increasingly used on cislunar and deep-space CubeSats",sources:["soa-avionics"],tags:["cdh:radhard","cdh:high-rad","cdh:expensive","cdh:low-compute","cdh:reliable"]},{id:"hybrid-cdh",level:"engineer",name:{e:"Hybrid: COTS performance + hardened supervisor",x:"Fast chip with a tough bodyguard"},blurb:{e:"A powerful commercial processor watched over by a small radiation-hardened guardian.",x:"A quick computer, with a tough little one keeping an eye on it."},how:{e:"A high-performance commercial SoC does the work, while a small rad-hard microcontroller holds the authority: it owns the power switches, monitors current for latch-up, keeps the real-time clock, holds a known-good backup image, and can force a reboot or a fallback to safe mode. The system is allowed to fail, as long as recovery cannot fail.",x:"The big fast computer does all the work, but a small tough chip is in charge of the power switches. If the big one crashes or gets stuck, the little one just turns it off and on again — and the little one is built so it cannot crash."},madeOf:{e:"Commercial SoC plus a hardened supervisor such as a Vorago part, latch-up protection circuitry, redundant non-volatile storage for golden images, and a hardware watchdog.",x:"A powerful chip plus a small space-proof chip, wired so the small one can always reset the big one."},whyChosen:{e:"This is where a lot of modern smallsat avionics has landed: you cannot afford rad-hard compute, but you can afford rad-hard authority. NASA has explicitly moved toward COTS for missions of at least a year while noting C&DH needs higher reliability than raw COTS gives.",x:"It is the best of both: the speed of a cheap chip, with something reliable in charge of rescuing it."},tradeoffs:{strengths:[{e:"Near-COTS performance and cost with a genuinely dependable recovery path.",x:"Fast and cheap, but can always be rescued."},{e:"The failure mode becomes a brief outage rather than a lost mission.",x:"A crash costs you minutes, not the whole satellite."}],limits:[{e:"Two processors means two software builds, two update paths and more integration testing.",x:"Two computers means twice as much software to write and test."},{e:"The supervisor logic is safety-critical and easy to get subtly wrong.",x:"If you get the rescue plan wrong, it does not rescue anything."}]},facts:[{label:"NASA posture",value:"NASA has shifted toward COTS for smallsat missions lasting at least a year, while noting C&DH needs higher reliability than COTS parts alone currently provide"},{label:"Techniques",value:"ECC/EDAC on memory, cold redundancy (full backup OBC), scrubbing, rad-hard supervisory circuits"}],flown:"Common architecture in modern commercial smallsat avionics",sources:["soa-avionics"],tags:["cdh:hybrid","cdh:high-compute","cdh:reliable","cdh:onboard-processing","cdh:complex"]}]},cp={id:"adcs",order:7,code:"ADCS",name:{e:"ADCS — Attitude Determination & Control",x:"Pointing the Right Way"},subtitle:{e:"Knowing which way you are facing, and changing it",x:"Working out which way it is facing, and turning it"},question:{e:"How will you control your attitude?",x:"How will your satellite turn and hold still?"},primer:{e:"Attitude is which way the spacecraft is facing. Determination is knowing it; control is changing it. These are two different problems and you need both. A satellite in orbit is in free fall with almost nothing to push against, so you cannot just steer — every torque has to come from either spinning a mass inside the spacecraft, pushing against Earth’s magnetic field, throwing propellant overboard, or exploiting a gradient in gravity. Meanwhile small torques from atmospheric drag, solar radiation pressure and magnetic residuals are constantly nudging you off target.",x:"Your satellite is falling around Earth with nothing to push against — no air, no ground, no brakes. So how do you turn it? There are only a few honest ways: spin a heavy wheel inside it, push against Earth’s magnetism like a compass needle, or squirt out some gas. Meanwhile tiny forces keep trying to tip it over, so you can never stop correcting."},realTalk:{e:"Pointing requirement comes from the payload, and it is the number that most often forces a redesign. A radio receiver may need 10°. A camera needs its image not to smear during the exposure. A laser downlink needs arcseconds.",x:"How steady you must be depends entirely on your job. A radio ear can be sloppy. A camera must hold very still. A laser must be almost perfect."},sources:["soa-gnc"],options:[{id:"passive-magnetic",level:"both",name:{e:"Passive magnetic stabilisation",x:"Compass-needle satellite"},blurb:{e:"A permanent magnet plus hysteresis rods. No power, no software, no failure modes.",x:"A magnet inside makes it line up with Earth, like a compass."},how:{e:"A permanent magnet aligns the satellite with Earth’s magnetic field, exactly as a compass needle does. On its own that would leave the satellite oscillating about the field line forever, so soft-magnetic hysteresis rods are added: as the field direction changes relative to the satellite, the rods repeatedly magnetise and demagnetise, and the energy lost to that hysteresis loop damps the wobble out.",x:"A magnet inside pulls the satellite into line with Earth’s own magnetism, like a compass needle. But a compass needle wobbles before it settles — so soft metal rods are added that soak up the wobbling energy and turn it into a tiny bit of heat."},madeOf:{e:"A hard permanent magnet (typically AlNiCo or samarium-cobalt) and soft-magnetic hysteresis rods, usually a nickel-iron alloy such as Permalloy or HyMu-80.",x:"One strong magnet, and a couple of soft metal rods."},whyChosen:{e:"It uses zero power, has no moving parts, needs no software and cannot fail. For a mission where you only need a rough, stable orientation — an omnidirectional radio receiver, a simple particle detector — it is genuinely the right engineering answer, not a compromise.",x:"It uses no electricity, has nothing that can break, and needs no computer at all. If you only need to be roughly the right way up, it is honestly the best choice."},tradeoffs:{strengths:[{e:"Zero power, zero software, effectively zero failure probability.",x:"Cannot break, uses no power."},{e:"Very cheap and very light.",x:"Cheap and light."}],limits:[{e:"You get one orientation — aligned with the local field — and it is not one you chose.",x:"You do not get to pick which way it faces."},{e:"The field direction changes around the orbit, so your pointing tumbles slowly relative to Earth or the Sun.",x:"Earth’s magnetism points different ways in different places, so your satellite keeps rolling over."},{e:"Accuracy is a matter of degrees, not fractions of a degree.",x:"Nowhere near precise enough for a camera."}]},facts:[{label:"Accuracy class",value:"Degrees; alignment is to the local magnetic field, not to a chosen target"},{label:"Power",value:"None"}],flown:"Many early 1U university CubeSats, including several ELaNa missions",sources:["soa-gnc"],tags:["adcs:passive","adcs:no-power","adcs:coarse","adcs:no-target-choice","adcs:reliable"]},{id:"magnetorquers",level:"both",name:{e:"Magnetorquers (torque rods and coils)",x:"Electromagnet pushers"},blurb:{e:"Electromagnets that push against Earth’s magnetic field. Cheap, robust, and fundamentally limited.",x:"Electromagnets that push against Earth itself to turn the satellite."},how:{e:"Running current through a coil creates a magnetic dipole, and a dipole in Earth’s field feels a torque. Crucially, the torque is the cross product of your dipole and the field, so you can only ever generate torque perpendicular to the field line — you have no authority at all about the field axis itself. As the satellite orbits, the field direction rotates relative to you, so over a full orbit you can control all three axes, just never all at the same instant.",x:"Send electricity through a coil of wire and it becomes a magnet. Earth is also a magnet, so the two push against each other and the satellite turns. The catch: you can only push sideways to Earth’s magnetism, never along it — so at any moment there is one direction you simply cannot turn."},madeOf:{e:"Copper wire wound on a high-permeability ferromagnetic core (rods) or as an air-core coil, sometimes etched directly into the solar panel PCB to save volume.",x:"Coils of copper wire, sometimes wound around a metal rod, sometimes printed flat onto a circuit board."},whyChosen:{e:"No moving parts, no propellant, and it runs on the electricity you already have. It is also the standard way to detumble after deployment: you come out of the deployer spinning, and a simple control law using only magnetorquers and a magnetometer will reliably bleed off that rotation.",x:"Nothing moves, so nothing wears out, and it only needs electricity. It is also how satellites stop spinning after they are pushed out of the rocket."},tradeoffs:{strengths:[{e:"No moving parts, no consumables — it works as long as you have power.",x:"Never runs out and never wears out."},{e:"Very light, cheap, and low risk; excellent for detumbling.",x:"Light, cheap and safe."}],limits:[{e:'NASA SoA is explicit: "magnetic torquers alone cannot typically provide three-axis stabilization".',x:"On their own they cannot hold the satellite steady in all directions."},{e:"Torque is tiny, so slewing to a new target takes many minutes.",x:"Very slow to turn."},{e:"Depends on Earth’s field, so it weakens with altitude and does not work at all away from Earth.",x:"Useless once you leave Earth — the Moon has no magnetic field to push against."},{e:"Your own coils interfere with your magnetometer, so you cannot always measure and torque at once.",x:"The coils confuse the satellite’s own compass."}]},facts:[{label:"Real device",value:"CubeSpace CubeTorquer CR0002: 0.2 A·m² dipole, 0.0165 kg"},{label:"Fundamental limit",value:"NASA SoA: torque is only available perpendicular to the local magnetic field"}],flown:"Nearly universal — almost every CubeSat carries magnetorquers even when it also has wheels",sources:["soa-gnc"],tags:["adcs:torquers","adcs:coarse","adcs:no-consumables","adcs:slow-slew","adcs:earth-only","adcs:reliable"]},{id:"wheels-plus-torquers",level:"both",name:{e:"Reaction wheels + magnetorquers",x:"Spinning wheels inside"},blurb:{e:"Three spinning wheels give real three-axis control; torquers dump the momentum they build up.",x:"Spin a wheel one way, and the satellite turns the other way."},how:{e:"Conservation of angular momentum: spin a flywheel faster in one direction and the spacecraft rotates the other way. Three wheels mounted orthogonally give full three-axis control, and you can slew to a target in seconds. The problem is that the disturbance torques never stop, so the wheels spin faster and faster to hold attitude until they saturate at maximum speed and stop being useful. Magnetorquers then apply an external torque against Earth’s field to bleed the momentum back out — desaturation, or momentum dumping.",x:"If you spin a wheel inside the satellite one way, the satellite turns the other way. Three wheels let you turn any direction you like, quickly. But tiny forces keep nudging the satellite, so the wheels have to spin faster and faster to fight back — until they hit their top speed. Then the electromagnets push against Earth to let the wheels slow down again."},madeOf:{e:"A brushless DC motor spinning a machined metal flywheel on precision bearings, with a motor controller and tachometer, plus the magnetorquers for desaturation.",x:"Little electric motors spinning heavy metal discs on very good bearings."},whyChosen:{e:"This is the standard architecture for any CubeSat that has to point an instrument. It is the cheapest way to get genuine sub-degree, three-axis, target-of-your-choice pointing, and it needs no propellant.",x:"This is what almost every camera satellite uses. It is the cheapest way to point precisely at whatever you want, and it never runs out of fuel."},tradeoffs:{strengths:[{e:"True three-axis control with fast slews to arbitrary targets.",x:"Can po
