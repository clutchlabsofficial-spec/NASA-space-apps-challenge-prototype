int anywhere you want, quickly."},{e:"Sub-degree pointing, enough for imaging and directional antennas.",x:"Steady enough for sharp photos."},{e:"No propellant — limited by wear, not by fuel.",x:"Never runs out of fuel."}],limits:[{e:"Bearings are the only continuously moving part on the satellite, and a wheel failure is usually permanent.",x:"The spinning parts wear out, and if a wheel dies you cannot fix it."},{e:"Wheels draw standby power all the time, not just when slewing.",x:"They use electricity constantly, even when just holding still."},{e:"Wheel imbalance injects jitter, which can blur a long exposure.",x:"The spinning makes a tiny buzz that can blur photos."},{e:"Desaturation still depends on magnetorquers, so it still depends on Earth’s field.",x:"You still need Earth’s magnetism to reset the wheels."}]},facts:[{label:"Real devices",value:"AAC Clyde Space RW210: 0.0001 Nm peak torque, 0.006 Nms momentum. Blue Canyon RWp015: 0.004 Nm, 0.015 Nms"},{label:"Range",value:"NASA SoA: reaction/momentum wheels and CMGs span 0.04–45 Nms capability across small spacecraft"},{label:"Requirement",value:'NASA SoA: "reaction wheels must be periodically desaturated using an actuator that provides an external torque, such as thrusters or magnetic torquers."'}],flown:"Planet Dove, FOREST, and essentially every imaging CubeSat",sources:["soa-gnc"],tags:["adcs:wheels","adcs:fine","adcs:fast-slew","adcs:standby-power","adcs:jitter","adcs:moving-parts","adcs:earth-only"]},{id:"integrated-startracker",level:"both",name:{e:"Integrated ADCS with star tracker",x:"Star-navigating autopilot"},blurb:{e:"A single sealed unit: wheels, torquers, star tracker, sun sensors and the control software.",x:"One box that looks at the stars to work out exactly which way it is facing."},how:{e:"A star tracker photographs a patch of sky, identifies the stars by their geometric pattern against an onboard catalogue, and from that computes absolute three-axis orientation directly — no drift, no reference to Earth. That is fundamentally better information than a magnetometer or sun sensor can give. Package that with wheels, torquers and a tuned control loop in one qualified unit and you get precise pointing without designing an ADCS yourself.",x:"A tiny camera takes a photo of the stars and recognises the patterns, exactly like you would recognise the Big Dipper. Because stars never move, it knows precisely which way it is facing. All of that comes in one sealed box you just bolt on."},madeOf:{e:"A baffled camera and star catalogue processor, reaction wheels, magnetorquers, sun sensors, magnetometer and an MEMS gyro, all in one housing with a single data interface.",x:"A small camera with a light shade, spinning wheels, magnets, sun detectors and a computer — all in one box."},whyChosen:{e:"Chosen when the pointing requirement is genuinely tight, or when the team does not have the expertise or schedule to build and tune an ADCS. Blue Canyon’s XACT family flew on MarCO all the way to Mars — a good demonstration that this class of unit is trusted for real missions.",x:"Picked when you must point very precisely, or when your team has no time to build a pointing system from scratch. This kind of box went to Mars on the MarCO satellites."},tradeoffs:{strengths:[{e:"The best pointing available at this scale — arcsecond-class knowledge.",x:"By far the most precise option."},{e:"One qualified unit removes an entire subsystem design task.",x:"You buy it working instead of building it."},{e:"Works away from Earth, since stars are everywhere.",x:"Works anywhere in the solar system."}],limits:[{e:"Expensive — often the single costliest item on a CubeSat.",x:"Very expensive."},{e:"A star tracker is blinded by the Sun and by a bright Earth limb in its field of view.",x:"If the Sun shines into it, it goes blind for a while."},{e:"Substantial volume and standby power for a 3U.",x:"Takes up room and uses power."},{e:"A sealed commercial unit is a black box — hard to debug when it misbehaves.",x:"If it goes wrong, you cannot look inside to see why."}]},facts:[{label:"Real unit",value:"Blue Canyon XACT-15: wheels + star tracker + sun sensors + magnetometer, 0.885 kg, 0.003°/0.007° pointing accuracy"},{label:"Star trackers",value:"Arcsec Sagitta: 6 arcsec cross-axis accuracy, 0.275 kg. CubeSpace CubeStar: 0.02° cross-axis, 0.047 kg"},{label:"Sun sensors",value:"Digital sun sensors reach ±0.01° to ±0.05°"}],flown:"MarCO (XACT, to Mars), MinXSS, many science CubeSats",sources:["soa-gnc","nasa-marco"],tags:["adcs:integrated","adcs:very-fine","adcs:fast-slew","adcs:standby-power","adcs:expensive","adcs:works-deep-space","adcs:moving-parts"]},{id:"gravity-gradient",level:"engineer",name:{e:"Gravity-gradient boom",x:"A long pole that keeps it upright"},blurb:{e:"Deploy a mass on a boom and let tidal forces hold you nadir-pointing for free.",x:"Stick out a long arm and Earth’s pull keeps the satellite the right way up."},how:{e:"Gravity is very slightly stronger at the near end of a long object than the far end. That difference produces a restoring torque that pulls the long axis into alignment with the local vertical, so one face permanently looks down at Earth. Deploying a boom with a tip mass massively increases the effect by increasing the difference in moments of inertia between the long axis and the other two.",x:"Earth pulls a tiny bit harder on the near end of a long satellite than the far end. That difference is enough to keep the long end pointing down at Earth — for free, forever. Sticking out a long pole makes it much stronger."},madeOf:{e:"A coilable or tape-spring boom (often carbon-fibre composite) with a tip mass, plus damping — commonly hysteresis rods or a viscous damper — to stop libration about the vertical.",x:"A springy pole that unrolls, with a weight on the end, plus something to soak up the swinging."},whyChosen:{e:"It gives permanent nadir pointing at zero power and near-zero complexity. If your instrument needs to look down and does not care about rotation about the vertical, this is a beautifully economical answer.",x:"It keeps your satellite looking down at Earth forever, without using any electricity at all."},tradeoffs:{strengths:[{e:"Zero power, permanent nadir pointing.",x:"Free, forever, no electricity."},{e:"No consumables and nothing to saturate.",x:"Never runs out."}],limits:[{e:"Only constrains two axes — the satellite can still rotate freely about the vertical.",x:"It can still spin around like a top."},{e:"Accuracy of several degrees, with slow libration you must damp.",x:"It swings gently, so it is never perfectly still."},{e:"The boom is a deployable mechanism and increases drag and stowed volume.",x:"The pole has to unfold, and unfolding things can jam."},{e:"It cannot tell you which way you are facing; you still need sensors.",x:"It does not know where it is pointing — it just points."}]},facts:[{label:"Accuracy class",value:"Several degrees, nadir-locked, uncontrolled in yaw"},{label:"Booms",value:'NASA Deployable Composite Booms offer high stiffness with "25% less weight than metallic booms"'}],flown:"A classic technique on early small satellites; still used where simplicity dominates",sources:["soa-gnc","soa-struct"],tags:["adcs:gravgrad","adcs:no-power","adcs:coarse","adcs:nadir-only","adcs:has-deployable","adcs:earth-only"]}]},dp={id:"thermal",order:8,code:"TCS",name:{e:"Thermal Control",x:"Hot and Cold"},subtitle:{e:"Managing heat where there is nothing to carry it away",x:"Keeping it from cooking or freezing"},question:{e:"How will you control temperature?",x:"How will you keep your satellite comfortable?"},primer:{e:"In vacuum there is no air, so two of the three ways heat moves are simply unavailable: no convection and no conduction to the outside. Radiation is the only path off the spacecraft. That means every watt your electronics consume has to be radiated away as infrared from a surface, and if there is not enough cold surface pointing at empty space, the temperature rises until there is. Then you pass into eclipse and the same physics works against you: you radiate to a 3 K sky and get very cold, very fast, because a CubeSat has almost no thermal mass to coast on.",x:"On Earth, hot things cool down because air carries heat away. In space there is no air, so the only way to lose heat is to glow it away as invisible infrared light. If your satellite cannot glow enough heat away, it cooks. And in Earth’s shadow the opposite happens: it dumps heat into empty space and freezes — and because it is so small and light, it changes temperature really fast."},realTalk:{e:'NASA’s SoA is blunt about the small-satellite penalty: low thermal mass causes reactive transient behaviour, external surface area is contested by solar cells and instrument apertures, and multi-layer insulation "generally does not perform as well on small spacecraft than on larger spacecraft" because edge effects dominate at small sizes.',x:"Small satellites have a harder time with heat than big ones. They warm up and cool down very quickly, and there is barely any spare outside wall left over once you have added solar panels and a camera hole."},sources:["soa-thermal"],options:[{id:"passive-coatings",level:"both",name:{e:"Passive: surface coatings and paints",x:"Special paint"},blurb:{e:"Choose the optical properties of every outside surface and let physics do the rest.",x:"Paint it the right colours and let it look after itself."},how:{e:"Every surface has two independent optical properties: solar absorptivity (how much sunlight it takes in) and infrared emissivity (how well it radiates heat away). Their ratio sets the equilibrium temperature. White paint has low absorptivity and high emissivity, so it stays cold in sunlight — that is why it makes a good radiator. Black paint absorbs and emits strongly. Polished metal does neither and is a good insulator. You tune the whole spacecraft by choosing which surface goes where.",x:"Colours matter enormously in space. White paint takes in very little sunlight but is brilliant at glowing heat away, so white surfaces stay cold. Black takes in lots and gives out lots. Shiny metal does neither, so it acts like a blanket. Engineers plan every single surface."},madeOf:{e:'Space-qualified white and black paints, second-surface silvered FEP tape, aluminised Kapton, and optical solar reflectors. NASA SoA notes second-surface silver FEP tapes "offer excellent performance as radiator coatings".',x:"Special space paints and shiny silver tapes made to survive sunlight without going yellow."},whyChosen:{e:"It costs almost nothing in mass, volume, power or complexity, and it never fails. Most small CubeSats fly entirely passive thermal control and are fine, because the electronics dissipate only a few watts.",x:"It weighs nothing, costs nothing, uses no power and cannot break. Most small satellites do only this."},tradeoffs:{strengths:[{e:"No mass, no power, no failure modes.",x:"Free, and it cannot break."},{e:"Well characterised and easy to model.",x:"Easy to plan and predict."}],limits:[{e:"Coatings degrade: NASA SoA notes darkening from atomic oxygen in LEO and UV higher up, so you must design to end-of-life properties, not beginning-of-life.",x:"Space slowly darkens the paint, so it works less well as the years pass — you have to plan for that."},{e:"No ability to respond: you get one fixed thermal design for all mission phases.",x:"It cannot adjust — it does the same thing hot or cold."},{e:"Cannot keep a battery above 0 °C through a long eclipse on its own.",x:"It cannot stop the battery getting too cold in the dark."}]},facts:[{label:"Radiator surfaces",value:'Matte white paint: "low solar absorptivity and high IR emissivity"'},{label:"Real use",value:'BioSentinel (6U) "made extensive use of Sheldahl metallized tape coatings and second-surface silvered FEP tapes"'}],flown:"Nearly every CubeSat; BioSentinel is a well-documented example",sources:["soa-thermal"],tags:["tcs:passive","tcs:no-power","tcs:no-heater","tcs:reliable"]},{id:"mli-straps",level:"both",name:{e:"Passive: insulation and conductive straps",x:"Space blankets and heat highways"},blurb:{e:"Insulate what must stay warm, and physically route heat from hot parts to cold surfaces.",x:"Wrap the cold bits, and build metal paths to carry heat away from the hot bits."},how:{e:"Multi-layer insulation is not a thick blanket — it is many thin reflective layers separated by netting, so heat has to radiate across dozens of low-emissivity gaps in series. Thermal straps do the opposite job: a flexible high-conductivity link that carries heat from a component that is overheating to a radiator panel, without mechanically constraining either.",x:"A space blanket is lots of very thin shiny sheets with tiny gaps between them — heat has to hop across every single layer, which is slow, so it stays trapped. A thermal strap is the opposite: a bendy metal rope that carries heat quickly away from something hot to somewhere cool."},madeOf:{e:'MLI from aluminised Kapton or Mylar with Dacron netting spacers. Straps from copper braid, aluminium foil stacks, or pyrolytic graphite sheet — NASA SoA notes PGS "demonstrate superior performance compared to metal foils".',x:"Shiny plastic sheets for the blanket. For the heat pipes-and-ropes: copper, aluminium, or a special layered carbon material that carries heat even better."},whyChosen:{e:"Chosen when one part of the spacecraft has a different temperature requirement from the rest — a battery that must stay above freezing, or a detector that must stay cool while the radio next to it runs hot. Straps let you decouple them without redesigning the layout.",x:"Used when one part needs to be warm and another needs to be cold. You wrap up the one that must stay warm, and run a metal rope from the hot one to a cold wall."},tradeoffs:{strengths:[{e:"Still fully passive — no power, no control loop.",x:"Uses no electricity."},{e:"Lets you give different components different temperatures.",x:"Different parts can be different temperatures."},{e:"Graphite straps are very light for their conductivity.",x:"The carbon ropes are very light."}],limits:[{e:'NASA SoA warns MLI "generally does not perform as well on small spacecraft" — compression and edge heat leaks dominate at CubeSat scale.',x:"Space blankets do not work as well on tiny satellites, because heat sneaks out around the edges."},{e:"Straps are a permanent thermal short: they help in the hot case and hurt in the cold case.",x:"A heat rope always carries heat away — even when you would rather stay warm."},{e:"MLI adds volume and is fiddly to install without creating leak paths.",x:"Blankets are awkward to fit properly."}]},facts:[{label:"Strap materials",value:"Copper, aluminium, or pyrolytic graphite sheet (PGS), which outperforms metal foils"},{label:"Small-sat caveat",value:"MLI underperforms on CubeSat form factors due to compression risk and edge heat transfer"}],flown:"Standard practice across small spacecraft",sources:["soa-thermal"],tags:["tcs:passive","tcs:no-power","tcs:straps","tcs:no-heater","tcs:decoupling"]},{id:"heaters",level:"both",name:{e:"Active: thermostatically controlled heaters",x:"Electric warmers"},blurb:{e:"Thin film heaters bonded to the battery and anything else that must not freeze.",x:"Little electric blankets that switch on when things get too cold."},how:{e:"A thin polyimide film heater is bonded directly to the component. A thermistor measures temperature and either a mechanical thermostat or the flight software closes the loop, switching the heater on below a set point. On most CubeSats the battery is the item that forces this, because charging lithium-ion below 0 °C permanently damages the cell.",x:"A flat sticky heating pad is glued to the cold part. A little thermometer watches the temperature, and when it drops too low the heater switches on. Batteries need this most — charging a cold battery ruins it."},madeOf:{e:"Etched-foil resistive elements laminated in Kapton (polyimide), with thermistors and either a bimetallic thermostat or software control through the EPS.",x:"A thin orange plastic pad with a wire pattern inside, plus a temperature sensor."},whyChosen:{e:"It is the only practical way to guarantee a minimum temperature during eclipse, and it is the standard answer for battery survival heating. It is mature: NASA SoA puts electrical heaters at TRL 7–9 in LEO.",x:"It is the only reliable way to stop something freezing in the dark. Almost every satellite with a battery has one."},tradeoffs:{strengths:[{e:"Directly solves the cold case, which passive design cannot.",x:"Actually fixes the freezing problem."},{e:"Cheap, light, simple, and very well proven.",x:"Cheap, light and reliable."}],limits:[{e:"It spends power — often a significant fraction of the orbit-average budget, and always at the worst time, in eclipse.",x:"It uses electricity exactly when you have least: in the dark."},{e:"Heaters only add heat; they cannot help you when you are too hot.",x:"A heater cannot cool anything down."},{e:"A stuck-on heater is a real failure mode that can overheat the component it was protecting.",x:"If it gets stuck on, it can cook the very thing it was meant to protect."}]},facts:[{label:"Maturity",value:'NASA SoA: "TRL values for electrical heaters on SmallSats are 7-9 in LEO environments."'},{label:"Power density",value:"0.4 to 7.75 W/cm² depending on design"},{label:"Temperature range",value:"Most Kapton constructions: −200 °C to 200 °C"}],flown:"Effectively universal on satellites carrying lithium batteries",sources:["soa-thermal","soa-power"],tags:["tcs:heaters","tcs:active","tcs:uses-power","tcs:protects-battery"]},{id:"pcm-heatpipe",level:"engineer",name:{e:"Heat pipes and phase-change material",x:"Heat sponges and heat pipes"},blurb:{e:"Move heat passively across the spacecraft, or absorb a burst of it and release it slowly.",x:"A tube that moves heat by itself, and wax that soaks up heat."},how:{e:"A heat pipe is a sealed tube with a working fluid and a wick. At the hot end the fluid boils, absorbing a large latent heat; the vapour flows to the cold end and condenses, releasing it; capillary action in the wick pulls the liquid back. It moves heat far better than solid metal, with no pump and no power. Phase-change material solves the opposite problem: a burst load like a radar pulse or a transmit window melts a wax, and the wax absorbs a large amount of energy at a nearly constant temperature, then refreezes slowly.",x:"A heat pipe is a sealed tube with liquid inside. At the hot end it boils into steam, which rushes to the cold end and turns back into liquid, dumping its heat there. Then it soaks back along the inside. It moves heat brilliantly with no pump at all. Phase-change wax is different: it melts when things get hot, soaking up loads of heat while staying the same temperature — like ice in a drink."},madeOf:{e:"Metal pipe with an internal wick and a working fluid (often ammonia or water depending on temperature range). PCM units are typically paraffin wax in a metal housing with internal fins.",x:"A metal tube with liquid inside, and a metal box packed with special wax."},whyChosen:{e:"Chosen for spacecraft with a strongly pulsed thermal load or a big hot spot that cannot sit next to a radiator. RainCube-class radars and burst high-rate downlinks are exactly this pattern: intense heat for a few minutes per orbit.",x:"Used when the satellite gets very hot for only a few minutes at a time — like when a radar fires or the radio blasts data home."},tradeoffs:{strengths:[{e:"Passive: no power and no moving parts, yet very high effective conductivity.",x:"Moves heat brilliantly without using any electricity."},{e:"PCM flattens temperature spikes without oversizing the radiator.",x:"Smooths out sudden heat bursts."}],limits:[{e:"PCM only buys you time — the heat still has to leave eventually.",x:"The wax only delays the problem; the heat still has to go somewhere."},{e:"Heat pipes have an orientation and acceleration sensitivity that complicates ground testing.",x:"Hard to test properly on Earth, because gravity changes how they work."},{e:"Adds mass and volume that a CubeSat can rarely spare.",x:"Heavy and bulky for a small satellite."}]},facts:[{label:"PCM materials",value:"Paraffin: 20–60 °C melting point, 140–280 kJ/kg heat of fusion. Water: 0 °C, 333 kJ/kg"},{label:"Flown hardware",value:"Redwire FlexCool heat pipe flew on TechEdSat-10, a 6U deployed from the ISS in 2020"}],flown:"TechEdSat-10; Redwire Q-Store and Q-Cache phase-change products",sources:["soa-thermal"],tags:["tcs:heatpipe","tcs:pcm","tcs:passive","tcs:pulse-load","tcs:mass"]},{id:"cryocooler",level:"engineer",name:{e:"Cryocooler",x:"A tiny fridge for the instrument"},blurb:{e:"A miniature mechanical refrigerator to hold a detector far below ambient.",x:"A real, working fridge small enough to fit in a satellite."},how:{e:"A Stirling or pulse-tube cryocooler cyclically compresses and expands a working gas, moving heat from a cold tip to a warm rejection surface. The cold tip is thermally strapped to the detector. This is the only way to reach the ~80–150 K where certain infrared detectors have acceptable dark current.",x:"It squeezes and releases a gas over and over. Squeezing makes gas hot, letting it expand makes it cold — so it pumps heat out of the detector and dumps it outside. That is how it gets things far colder than space usually would."},madeOf:{e:"A compressor with a moving piston or displacer, a regenerator, and a cold finger, plus its drive electronics and a rejection radiator that must actually be able to dump the waste heat.",x:"A tiny pump with moving parts, plus a cold metal finger that touches the detector."},whyChosen:{e:"Only chosen when the physics demands it: cooled mid-wave and long-wave infrared spectrometers cannot work warm. Lunar IceCube flew a 600 mW cryocooler for its BIRCHES spectrometer, and LunIR flew a Lockheed Martin MICRO1-1.",x:"Only used when the instrument genuinely will not work unless it is freezing cold. Some space telescopes need this."},tradeoffs:{strengths:[{e:"Enables detector classes that are otherwise impossible on a CubeSat.",x:"Lets you fly instruments that could not work any other way."},{e:"Flight-proven at 6U scale.",x:"Already done on a small satellite."}],limits:[{e:"High continuous power draw — often the largest single load on the spacecraft.",x:"Uses a huge amount of electricity, all the time."},{e:"Moving parts running for the whole mission: the dominant wear-out item.",x:"It has moving parts running constantly, so it wears out."},{e:"Exports vibration straight into the instrument it is cooling.",x:"It buzzes, and that buzz can blur the very instrument it is helping."},{e:"Needs a real radiator to reject the heat it pumps.",x:"It has to dump the heat somewhere, so you need a big cold panel too."}]},facts:[{label:"Real units",value:"Lockheed Martin MICRO1-1: 1 W cooling at 150 K cold tip, flown on LunIR (Artemis I). Ricor K508N: 0.2 W at 80 K, 0.475 kg"},{label:"Real mission",value:"Lunar IceCube (6U, Artemis I 2022): 600 mW cryocooler for the BIRCHES spectrometer"}],flown:"LunIR, Lunar IceCube",sources:["soa-thermal"],tags:["tcs:cryo","tcs:active","tcs:very-high-power","tcs:jitter","tcs:moving-parts","tcs:needs-radiator"]}]},hp={id:"comms",order:9,code:"COM",name:{e:"Communications",x:"Talking to Earth"},subtitle:{e:"The link that turns data into a mission",x:"How it sends its answers home"},question:{e:"What radio link will you fly?",x:"How will your satellite talk to Earth?"},primer:{e:"Data that stays on the spacecraft is worth nothing. In low Earth orbit a ground station sees you for only about eight to twelve minutes per pass, and you might get four to six usable passes a day — so your entire mission output is limited to what fits through that window. Higher frequencies carry more data per second, but they need tighter beams, which means better pointing and better ground antennas. That is the whole trade.",x:"Everything your satellite learns is useless until it gets home. The problem is that your satellite whizzes past your ground station in about ten minutes, and then it is gone for hours. So you have a very short window to send everything. Faster radios exist, but they have to aim much more carefully."},realTalk:{e:"Radio is regulated. You cannot simply transmit: amateur bands require a licence and a genuine amateur-service purpose with coordination through the IARU, and commercial bands need a national licence such as an FCC authorisation. Many student missions choose UHF specifically because the amateur community will help them coordinate it.",x:"You are not allowed to just switch on a radio in space. Every frequency has rules and you must ask permission first. Many school satellites use the ham-radio bands because ham-radio clubs around the world help them."},sources:["soa-comms"],options:[{id:"uhf-vhf",level:"both",name:{e:"VHF/UHF amateur-band transceiver",x:"Simple long-wave radio"},blurb:{e:"The most-flown CubeSat radio. Slow, forgiving, and almost impossible to lose contact with.",x:"A simple radio, like a walkie-talkie. Slow, but very hard to lose."},how:{e:"A low-power transceiver drives a deployable tape antenna — literally a strip of spring steel like a tape measure, rolled up and released in orbit. At these wavelengths the antenna pattern is nearly omnidirectional, so the link closes no matter which way the satellite is facing. That is the crucial property: it works even while you are still tumbling out of the deployer.",x:"A small radio connected to a springy metal strip like a tape measure, curled up and released in space. The signal goes out in all directions, so it does not matter which way the satellite is facing — you can always hear it, even while it is still spinning."},madeOf:{e:"A commercial transceiver board, a burn-wire-released beryllium-copper or steel tape antenna, and a simple modulation scheme. ISISPACE tape antennas are around 89 g.",x:"A small radio board and a rolled-up metal tape that springs out. The whole thing weighs less than an apple."},whyChosen:{e:"Chosen when reliability of contact matters more than throughput, and for any mission whose data is small: telemetry, decoded AIS messages, particle counts. It is also the safety net — a satellite whose main radio fails can often still be commanded on UHF.",x:"Picked when you do not have much data to send, or when you simply must not lose contact. It is also the backup if the fancy radio breaks."},tradeoffs:{strengths:[{e:"Near-omnidirectional: closes the link with no pointing at all.",x:"Works whichever way the satellite is facing."},{e:"Cheap, low power, and a worldwide amateur ground-station community that will help you receive it.",x:"Cheap, and radio hobbyists all over the world will help listen for it."},{e:"Robust to attitude loss — often the only link that still works in an emergency.",x:"Still works even if the satellite goes out of control."}],limits:[{e:"Very low data rate — NASA SoA lists VHF/UHF transceivers up to 38.4 kbps.",x:"Very slow. Sending one photo could take hours."},{e:"Cannot realistically downlink imagery or hyperspectral data.",x:"No good for cameras."},{e:"Crowded, noisy bands with interference from Earth.",x:"Lots of other radios in the way."}]},facts:[{label:"Bands",value:"VHF: 30–300 MHz. UHF: 300–1000 MHz"},{label:"Maturity",value:'NASA SoA: "The most mature bands used for CubeSat communication are VHF and UHF frequencies."'},{label:"Data rate",value:"Up to 38.4 kbps"}],flown:"The default on university CubeSats worldwide",sources:["soa-comms"],tags:["com:uhf","com:low-rate","com:omni","com:no-pointing","com:has-deployable","com:low-power","com:robust"]},{id:"s-band",level:"both",name:{e:"S-band transceiver",x:"Medium-speed radio"},blurb:{e:"The standard telemetry and command band, and a real step up in throughput.",x:"A faster radio that needs to aim roughly at the right place."},how:{e:"At 2–4 GHz the wavelength is short enough that a flat patch antenna a few centimetres across has useful gain, so you get a real data-rate improvement without a deployable. Gain means directionality, though: a higher-gain patch has a narrower beam, so now the satellite has to be pointing roughly Earthward during a pass.",x:"This radio uses shorter waves, which means a small flat antenna can focus the signal instead of spraying it everywhere. Focusing makes it much faster — but now the satellite has to be facing roughly the right way when it talks."},madeOf:{e:"A patch antenna (often a small ceramic-loaded plate mounted flush to a face) and an S-band transceiver board. Patch gains typically run 6–11.5 dBi.",x:"A small flat square antenna stuck to one side, plus a radio board."},whyChosen:{e:"It is the conventional choice for telemetry, tracking and command, and it hits a genuine sweet spot: enough throughput for compressed imagery or a rich science stream, without needing precise pointing or an exotic ground station. Most professional smallsat ground networks support it directly.",x:"It is the middle option — much faster than the simple radio, but not so fussy that you need a perfect aim or a giant dish on the ground."},tradeoffs:{strengths:[{e:"Big throughput gain over UHF for modest complexity.",x:"Much faster than the simple radio."},{e:"No deployable antenna needed — a flush patch works.",x:"The antenna does not need to unfold."},{e:"Supported by commercial ground-station networks worldwide.",x:"Lots of ground stations can talk to it."}],limits:[{e:"Needs coarse Earth pointing during the pass, so it depends on your ADCS working.",x:"The satellite must be facing roughly the right way."},{e:"Licensing is a real process; you cannot use amateur coordination.",x:"You need proper official permission to use it."},{e:"Higher transmit power than UHF, which hits the power budget during passes.",x:"Uses more electricity while it talks."}]},facts:[{label:"Band",value:'S-band: 2–4 GHz. "Satellite Tracking, Telemetry & Command (TT&C) is typically conducted over S-band."'},{label:"Demonstrated",value:"NASA Near Space Network achieved 15 Mbps with 16APSK LDPC 9/10 coding on S-band"},{label:"Antennas",value:"IQ spacecom S-band high-gain patch: 11.5 dBi, 179 g"}],flown:"Very widely used across commercial and science smallsats",sources:["soa-comms"],tags:["com:sband","com:medium-rate","com:needs-coarse-pointing","com:no-deployable"]},{id:"x-band",level:"both",name:{e:"X-band high-gain downlink",x:"Fast focused radio"},blurb:{e:"A narrow, high-gain beam for serious data volume. Point it properly or you get nothing.",x:"A very fast radio that has to aim carefully, like a torch beam."},how:{e:"At 8–12 GHz you can build genuinely directive antennas at CubeSat scale — a horn, or a flat reflectarray whose surface pattern focuses the beam like a dish without being shaped like one. All the transmitted power goes into a narrow cone instead of spreading over the sky, which is what buys you orders of magnitude more data. The cost is that the cone is narrow, so pointing error translates directly into lost link.",x:"Think of the difference between a bare light bulb and a torch. Same power, but the torch focuses it all into a beam, so it reaches much further. This radio is the torch — brilliant if you aim it right, useless if you miss."},madeOf:{e:"A horn, patch array, or deployable reflectarray, plus an X-band transmitter. MarCO flew an X-band reflectarray all the way to Mars; MMA Design’s T-DaHGR reaches 29–42.5 dBi.",x:"A funnel-shaped or flat panel antenna that focuses the radio beam, plus a fast transmitter."},whyChosen:{e:"Chosen when the payload generates more data than a slower link can clear: high-resolution imagery, hyperspectral cubes, radar. It is also the deep-space workhorse, which is why MarCO used it.",x:"Used when the satellite takes so many pictures that a slow radio could never send them all home in time."},tradeoffs:{strengths:[{e:"Very high data rates — NASA SoA lists X-band SDR transceivers up to 6 Gbps.",x:"Extremely fast."},{e:"Proven at planetary distance.",x:"Good enough to reach us from Mars."}],limits:[{e:"Requires accurate attitude control throughout the pass — this option depends on your ADCS choice.",x:"You must be able to aim the satellite accurately, or it will not work at all."},{e:"A high-gain deployable antenna is another mechanism that can fail.",x:"If the antenna needs to unfold, it might jam."},{e:"Higher power draw and a bigger ground antenna requirement.",x:"Needs more power, and a bigger dish on the ground."},{e:"Rain attenuates X-band, so weather at the ground station matters.",x:"Heavy rain at the ground station can block it."}]},facts:[{label:"Band",value:"X-band: 8–12 GHz"},{label:"Real hardware",value:"Syrlinks EWC27: X-band, 1.4 Gbps, 235 g. EnduroSat X-band 4×4 antenna: 16 dBi, 53 g"},{label:"Heritage",value:"MarCO used an X-band reflectarray to relay InSight landing telemetry from Mars"},{label:"Ka-band comparison",value:'ISARA demonstrated "over 100 Mbps downlink rate" with a Ka-band reflectarray on a 3U'}],flown:"MarCO; widely used on high-data-rate Earth-observation smallsats",sources:["soa-comms","nasa-marco"],tags:["com:xband","com:high-rate","com:needs-fine-pointing","com:high-power","com:directional"]},{id:"optical",level:"engineer",name:{e:"Optical (laser) downlink",x:"Laser beam messages"},blurb:{e:"Send data on a laser beam. Staggering data rates; blocked by a single cloud.",x:"Send information on a laser. Incredibly fast — unless a cloud gets in the way."},how:{e:"Beam divergence scales as wavelength divided by aperture diameter, and an optical wavelength is about ten thousand times shorter than an X-band one. So a small telescope produces a beam vastly tighter than any radio antenna of the same size — almost none of your transmitted energy is wasted lighting up empty sky. The consequence is that you now have to point a beam only a few tens of microradians wide at a specific telescope on a rotating planet, from an object moving at 7.6 km/s.",x:"Light waves are thousands of times smaller than radio waves, so a small lens can squeeze a laser into an incredibly thin beam. Almost none of it is wasted. The catch: you now have to hit a specific telescope on Earth with a beam thinner than a pencil, while flying past at 7.6 kilometres every second."},madeOf:{e:"A laser transmitter, a small telescope, and a fine-pointing mechanism — often a fast steering mirror decoupled from the spacecraft body, because spacecraft ADCS alone is not steady enough.",x:"A laser, a small telescope, and a tiny mirror that can twitch very fast to keep the beam on target."},whyChosen:{e:"Chosen only when the data volume is genuinely impossible by radio. TBIRD demonstrated 200 Gbps downlinks from a CubeSat — that is not an incremental improvement over X-band, it is a different category. Optical also needs no spectrum licence, which is increasingly attractive as RF bands congest.",x:"Only used when there is simply too much data for any radio. One NASA experiment sent 200 billion bits every second from a CubeSat."},tradeoffs:{strengths:[{e:"Data rates no radio link can approach.",x:"Unbelievably fast."},{e:"No spectrum licensing, and the narrow beam is inherently hard to intercept or jam.",x:"No radio licence needed, and very hard to eavesdrop on."}],limits:[{e:"Clouds stop it dead. You need clear sky and usually a network of geographically separated stations.",x:"A single cloud blocks it completely."},{e:"Pointing requirement is far beyond ordinary CubeSat ADCS — it needs its own fine-steering stage.",x:"Needs far better aiming than a normal satellite can manage."},{e:"Very few ground stations exist, so access is scarce.",x:"There are hardly any ground stations that can receive it."},{e:"Immature relative to RF: still largely demonstration missions.",x:"Still mostly an experiment, not everyday technology."}]},facts:[{label:"Record",value:'MIT Lincoln Laboratory TBIRD: "200 Gbps downlinks" — the most advanced demonstrated'},{label:"Other demos",value:"Aerospace Corp OCSD: 200 Mbps from a 1.5U to a 40 cm ground station. DLR OSIRISv2: 1 Gbps"},{label:"Crosslinks",value:"MIT CLICK-A demonstrated 20 Mbps at 25–580 km separation"}],flown:"TBIRD, OCSD, OSIRIS, CLICK",sources:["soa-comms","nasa-tbird"],tags:["com:optical","com:extreme-rate","com:needs-extreme-pointing","com:weather-dependent","com:immature"]}]},pp={id:"ground",order:10,code:"GND",name:{e:"Ground Segment & Operations",x:"The Team on Earth"},subtitle:{e:"Half the mission is on the ground, and it is the half people forget",x:"The part of the mission that stays at home"},question:{e:"Who will you talk to, and how often?",x:"Who on Earth will listen to your satellite?"},primer:{e:"A satellite is only half a system. The other half is the antenna, the receiver, the scheduling software and the people who read the telemetry at three in the morning when something goes wrong. Your ground segment choice sets how often you can talk to your spacecraft, and therefore how quickly you can react to a problem and how much data you can actually get down — a fast radio with only one ground station in one country is still a slow mission.",x:"A satellite on its own is useless — someone on Earth has to listen to it. How many listening stations you have decides how often you can hear from your satellite, and how fast you can help if it gets into trouble. A super-fast radio does not help if nobody is listening."},realTalk:{e:"Operations is where student missions most often lose. The satellite works, but nobody planned who is on console at 4 am on a Saturday, so the first anomaly goes unnoticed for a week. NASA CubeSat 101 spends real page count on this.",x:"Lots of school satellites work perfectly and still fail — because nobody was listening when they needed help. Planning who is on duty matters as much as the wiring."},sources:["cubesat101"],options:[{id:"single-station",level:"both",name:{e:"One ground station you build yourself",x:"Your own antenna on the roof"},blurb:{e:"A steerable Yagi on a rooftop and a rotator controller. Total control, total dependence.",x:"Build your own antenna and point it at the sky yourself."},how:{e:"A pair of crossed Yagi antennas on an azimuth-elevation rotator tracks the satellite across the sky using a predicted pass from its orbital elements. A software-defined radio and a laptop handle the modem. You get roughly four to six usable passes a day and only when the orbit brings you overhead.",x:"You put an antenna on the roof on a motor that turns it to follow the satellite across the sky, using a computer prediction of where it will be. You get a handful of chances to talk each day."},madeOf:{e:"Crossed-Yagi antennas, an az-el rotator, low-noise amplifier, an SDR dongle or transceiver, and open-source tracking software. It is genuinely buildable by a school club for a modest budget.",x:"Metal antenna rods, a motor to turn them, an amplifier and a computer. A school club really can build this."},whyChosen:{e:"It costs almost nothing per pass, it teaches the team enormously, and you own the whole loop. CSSWE was operated from a ground station the students built on the roof of a LASP building.",x:"It is cheap, and you learn a huge amount. A student team really did run a NASA-funded satellite from an antenna they built on their own roof."},tradeoffs:{strengths:[{e:"No recurring cost and complete operational control.",x:"Free to use once built, and it is all yours."},{e:"Superb learning value; the team understands the whole link.",x:"You learn how everything really works."}],limits:[{e:"Only 4–6 passes a day, each roughly 8–12 minutes, and only over your location.",x:"You can only talk a few times a day, for about ten minutes each."},{e:"Weather, hardware faults and staffing all take your only station offline.",x:"If your antenna breaks, you have no way to talk at all."},{e:"Total downlink volume is hard-capped regardless of how fast your radio is.",x:"Even a fast radio cannot send much if you only get ten minutes a day."}]},facts:[{label:"Real example",value:"CSSWE was operated for more than two years from a student-built ground station on a LASP building roof"},{label:"Pass geometry",value:"A LEO satellite is typically in view for roughly 8–12 minutes per overhead pass"}],flown:"CSSWE, and most university CubeSats",sources:["eo-csswe","cubesat101"],tags:["gnd:single","gnd:low-contact","gnd:cheap","gnd:high-latency"]},{id:"amateur-network",level:"both",name:{e:"Volunteer amateur-radio network",x:"Radio hobbyists around the world"},blurb:{e:"Thousands of amateur operators worldwide who will receive your beacon and upload it.",x:"Radio fans everywhere help catch your satellite’s messages."},how:{e:"If you fly an amateur-band beacon with a published, open telemetry format, volunteer operators around the world receive your packets whenever you pass over them and upload them to a shared database such as SatNOGS. You effectively get a global receive network for free — but only for downlink, and only for whatever you broadcast openly.",x:"Radio hobbyists all over the world point their antennas at passing satellites for fun. If you publish how to decode your satellite, they will catch your messages wherever you fly and put them on a website for you."},madeOf:{e:"Nothing extra on the spacecraft beyond an amateur-band beacon and published decoding information — plus the community relationship, which you build by coordinating your frequency through the IARU well before launch.",x:"Nothing extra to build! You just have to use the hobby radio bands and tell people how to listen."},whyChosen:{e:"It transforms your contact schedule: instead of a handful of passes over one city, you get partial coverage everywhere the network reaches. For early commissioning — when you desperately want to know whether the satellite survived launch — this is invaluable.",x:"Instead of only hearing your satellite when it flies over your school, you hear it from all over the world. That is amazing when you are anxiously waiting to find out if it survived launch."},tradeoffs:{strengths:[{e:"Near-global receive coverage at no cost.",x:"People everywhere listening, for free."},{e:"Enormously helpful in the first days after deployment.",x:"Brilliant for the scary first few days."}],limits:[{e:"Receive only — you still need your own station to command the satellite.",x:"They can only listen; you still need your own antenna to send commands."},{e:"Restricted to amateur bands, which caps your data rate and forbids commercial use.",x:"Only works on the hobby radio channels, which are slow."},{e:"Coverage is best-effort, not guaranteed; nobody owes you a pass.",x:"People help when they can, but nobody has to."}]},facts:[{label:"Requirement",value:"Amateur-band use requires IARU frequency coordination and a genuine amateur-service purpose"},{label:"Coverage",value:"Volunteer networks provide global receive coverage for open beacon formats"}],flown:"Used by a large fraction of university CubeSats alongside their own station",sources:["cubesat101","soa-comms"],tags:["gnd:amateur","gnd:global-receive","gnd:cheap","gnd:uhf-only","gnd:no-command"]},{id:"commercial-network",level:"engineer",name:{e:"Commercial ground-station-as-a-service network",x:"Rent a worldwide network of dishes"},blurb:{e:"Book time on somebody else’s global antenna network, pay per pass.",x:"Pay to use big dishes all over the world."},how:{e:"Operators run large steerable dishes at polar and mid-latitude sites and sell scheduled contacts. You submit a pass request through an API, the network points the antenna, demodulates your downlink and delivers the bits to cloud storage. A high-latitude station is especially valuable for a polar orbit, because a satellite in a near-polar orbit passes over the poles on every single revolution.",x:"Some companies own big dishes in lots of countries and rent out time on them. You book a slot, they catch your data and put it in the cloud for you. Dishes near the poles are the best, because a polar satellite flies over the poles every single lap."},madeOf:{e:"Nothing on your spacecraft beyond a standards-compliant radio — typically CCSDS-framed S-band or X-band, which is exactly why standards exist.",x:"Nothing extra on the satellite, as long as your radio speaks the standard language everyone else uses."},whyChosen:{e:"Chosen when latency or volume is the mission driver. A wildfire alert is worthless six hours late; with a polar network you can be downlinking within minutes of the observation. This is why operational Earth-observation constellations do not run their own single station.",x:"You need this when your news must arrive fast. A fire warning that arrives six hours late is no use to anyone."},tradeoffs:{strengths:[{e:"Many contacts per day, including high-latitude stations that see every polar orbit.",x:"Talk to your satellite many times a day."},{e:"Turns a low-latency mission from impossible into routine.",x:"Gets urgent news home fast."},{e:"Professionally maintained; no rooftop hardware to keep working.",x:"Someone else fixes the antennas."}],limits:[{e:"Real recurring cost per pass — usually out of reach for a student budget.",x:"You pay every time you use it, which adds up fast."},{e:"Requires standards-compliant framing and proper licensing.",x:"Your radio has to follow the official rules exactly."},{e:"You are one customer among many; scheduling is not always on your terms.",x:"You have to share with everyone else who booked."}]},facts:[{label:"Why polar stations",value:"A near-polar orbit crosses high latitudes on every revolution, so a polar ground station sees almost every pass"},{label:"Standards",value:"CCSDS framing is the interoperability standard these networks expect"}],flown:"Standard practice for commercial constellations including Planet and Spire",sources:["soa-comms","eo-planet"],tags:["gnd:commercial","gnd:high-contact","gnd:low-latency","gnd:expensive"]}]},fp={id:"propulsion",order:11,code:"PROP",name:{e:"Propulsion & End of Life",x:"Moving, and Coming Home"},subtitle:{e:"Changing your orbit, and being a good citizen when you are done",x:"How it moves — and how it tidies up after itself"},question:{e:"Will you carry propulsion, and how will you dispose of the spacecraft?",x:"Will your satellite have an engine, and how will it clean up?"},primer:{e:"Most CubeSats have no propulsion at all, and that is a legitimate design. But two things push you toward it: wanting to change your orbit, and needing to leave it. Since September 2022 the FCC has required satellites it licenses in low Earth orbit to be disposed of within five years of launch, down from the previous 25. Below about 400 km, atmospheric drag does that for you automatically. Between 400 and 800 km it usually will not, and you need a plan.",x:"Most small satellites have no engine at all, and that is fine. But there is a rule now: if you launch into low orbit, you must be gone within five years so you do not become space junk. If you fly really low, the thin air pulls you down by itself. Higher up, you have to do something about it."},realTalk:{e:"Propulsion is also the hardest thing to get through launch safety review. A pressurised tank or an energetic propellant on a rideshare with somebody else’s expensive primary payload attracts an enormous amount of scrutiny, and that paperwork is often the real cost.",x:"Rocket companies get very nervous about engines and fuel tanks riding along with their expensive main satellite. Getting permission is often harder than building the engine."},sources:["soa-prop","soa-deorbit","fcc-5yr"],options:[{id:"none-natural",level:"both",name:{e:"No propulsion — natural orbital decay",x:"No engine. Let the air bring it down."},blurb:{e:"Fly where the atmosphere will remove you on its own. Simplest possible answer.",x:"Fly low enough that the thin air slowly pulls it back to Earth."},how:{e:"Even at 400 km there is a trace atmosphere. Every orbit it takes a little energy out of your orbit, lowering you slightly, into slightly denser air, which takes more energy — so decay accelerates and ends with reentry. How fast depends on your ballistic coefficient: a light satellite with big solar panels comes down noticeably faster than a dense compact one.",x:"Even where satellites fly there is a tiny bit of air left. It rubs against the satellite every lap, slowing it down a little, so it sinks a bit lower — where there is more air, so it slows even faster. Eventually it burns up."},madeOf:{e:"Nothing. This is a choice not to build something, which is often the correct engineering decision.",x:"Nothing at all! Sometimes the best engineering is not building something."},whyChosen:{e:"It is the right answer for the majority of CubeSats. No tank, no valves, no safety review, no failure mode, and full debris compliance provided your orbit is low enough. The mission just has to be short enough to fit the natural lifetime.",x:"This is what most small satellites do. Nothing to build, nothing to break, and no space junk left behind."},tradeoffs:{strengths:[{e:"Zero mass, cost, power, complexity and risk.",x:"Costs nothing and cannot fail."},{e:"Automatically compliant below roughly 400 km.",x:"Follows the rules by itself if you fly low."}],limits:[{e:"You cannot change your orbit at all — no altitude maintenance, no phasing, no collision avoidance.",x:"You can never move out of the way of anything."},{e:"Your mission ends when the atmosphere decides, not when you do.",x:"You do not get to choose when it ends."},{e:"Above ~400 km this may not meet the 5-year rule on its own.",x:"If you fly higher, this is not enough to follow the rules."}]},facts:[{label:"Rule",value:"FCC, September 2022: LEO satellites (<2000 km) must be disposed of within 5 years post-launch"},{label:"Decay",value:"NASA SoA: below 400 km, most small satellites decay naturally within 5 years"},{label:"Solar cycle",value:"Drag increases at solar maximum, so decay is faster"}],flown:"The majority of CubeSats ever launched",sources:["soa-deorbit","fcc-5yr"],tags:["prop:none","prop:no-manoeuvre","eol:natural","prop:simple"]},{id:"drag-sail",level:"both",name:{e:"Drag sail / deorbit device",x:"A parachute for space"},blurb:{e:"Deploy a large thin membrane at end of mission to multiply your drag and fall out fast.",x:"Unfold a big thin sheet so the thin air grabs it and pulls it down."},how:{e:"You cannot make the atmosphere thicker, but you can make yourself catch more of it. Deploying a membrane on booms multiplies your cross-sectional area many times over, which slashes your ballistic coefficient and turns a decades-long decay into months or a couple of years. It is deliberately one-way: once it opens, your mission is ending.",x:"You cannot make more air, but you can make yourself bigger so you catch more of it. Unfolding a big thin sheet is like opening a parachute — the tiny bit of air pulls much harder and you come down far sooner."},madeOf:{e:"A thin polymer membrane, commonly aluminised Kapton or Mylar a few microns thick, on tape-spring or coilable booms, with a burn-wire or pin-puller release.",x:"A sheet of shiny plastic thinner than a crisp packet, held out by springy metal strips that unroll."},whyChosen:{e:"It is the standard way for a satellite above 400 km to meet the disposal rule without carrying propellant. It is entirely passive once deployed, needs no propellant and no power, and it is light: MMA Design’s dragNET is a 2.8 kg module giving 14 m² of drag area.",x:"It is how a satellite that flies too high to come down naturally follows the clean-up rules — without needing any fuel at all."},tradeoffs:{strengths:[{e:"Passive, propellant-free, and light for the effect it produces.",x:"No fuel needed, and very light."},{e:"Flight-proven repeatedly across a range of spacecraft sizes.",x:"Already worked on lots of real satellites."}],limits:[{e:"A one-shot deployment: if it fails to open, you have no disposal plan at all.",x:"If it does not open, you are stuck up there."},{e:"Premature deployment ends the mission early — the failure mode is severe in both directions.",x:"If it opens too soon, your mission is over."},{e:"A big sail is a big collision cross-section while it is decaying.",x:"While it is coming down, it is a much bigger target for other satellites."},{e:"Cannot help you avoid a collision — it only ends the mission tidily.",x:"It cannot steer you out of the way of anything."}]},facts:[{label:"Real hardware",value:"MMA Design dragNET: 2.8 kg module, 14 m² drag area; can deorbit a 180 kg spacecraft from 850 km within 10 years"},{label:"Flown",value:'NanoSail-D2 (2011) deorbited from 650 km. InflateSail (2017) deorbited in "just 72 days"'},{label:"CubeSat scale",value:"CanX-7 flew four modules each providing 1 m² of drag area from ~700 km SSO"}],flown:"NanoSail-D2, CanX-7, InflateSail, Spinnaker 3",sources:["soa-deorbit"],tags:["prop:none","prop:no-manoeuvre","eol:dragsail","prop:has-deployable"]},{id:"tether",level:"engineer",name:{e:"Electrodynamic tether",x:"A long wire that brakes on Earth’s magnetism"},blurb:{e:"Unreel a conductive tape and let Earth’s magnetic field brake you electromagnetically.",x:"Unroll a long metal ribbon and let Earth’s magnetism drag on it."},how:{e:"A conductive tape moving through Earth’s magnetic field has a voltage induced along it. If current can flow — collected from and emitted into the surrounding ionospheric plasma — then that current in the magnetic field produces a force opposing the motion. You are braking against a planet’s magnetic field with no propellant at all.",x:"Move a wire through a magnet’s field and electricity flows in it. Earth is a giant magnet, so a long ribbon trailing behind a satellite generates a current — and that current pushes back against Earth, slowing the satellite down. No fuel needed at all."},madeOf:{e:"A conductive aluminium tape stowed on a spool, with a deployment mechanism and plasma contactors. Tethers Unlimited’s CubeSat Terminator Tape masses just 0.083 kg.",x:"A long thin metal ribbon rolled up on a spool, which unwinds in space."},whyChosen:{e:"Chosen for extremely low mass relative to the deorbit effect, particularly on larger spacecraft where a sail would need to be impractically big.",x:"Chosen because it is incredibly light for how well it works."},tradeoffs:{strengths:[{e:"Very low mass — the CubeSat version is 83 grams.",x:"Astonishingly light."},{e:"No propellant and no pressure vessel, so an easy safety review.",x:"No fuel, so nothing to worry about at launch."}],limits:[{e:"Only works where there is a magnetic field and ionospheric plasma — Earth orbit only.",x:"Only works around Earth."},{e:"A long thin tether is vulnerable to being cut by micrometeoroids and debris.",x:"A tiny bit of space dust could cut the ribbon."},{e:"Deployment dynamics are complex and hard to test on the ground.",x:"Very hard to test properly before launch."}]},facts:[{label:"Real hardware",value:"Terminator Tape: NanoSat version 0.808 kg with 70 m of conductive tape; CubeSat version 0.083 kg"},{label:"Demonstrated",value:"Flown on Prox-1, a 71 kg satellite, in 2019"}],flown:"Prox-1 (2019)",sources:["soa-deorbit"],tags:["prop:none","prop:no-manoeuvre","eol:tether","prop:has-deployable","prop:earth-only"]},{id:"cold-gas",level:"both",name:{e:"Cold gas thrusters",x:"Puffs of gas"},blurb:{e:"Release stored gas through a nozzle. The simplest real rocket there is.",x:"Let a stored gas squirt out of a small hole to push the satellite."},how:{e:"A propellant stored under pressure — or as a liquid or solid that turns to gas — is released through a nozzle. There is no combustion and nothing to ignite: the only energy is the pressure you stored on the ground. That makes it the safest and simplest propulsion class, and also the least efficient, because a cold gas carries far less energy per kilogram than a chemical reaction.",x:"Like letting go of a blown-up balloon. Gas rushes out of a small hole, and the satellite gets pushed the other way. Nothing burns, nothing explodes — it is just squeezed gas escaping."},madeOf:{e:"A tank, a regulator, solenoid valves and small nozzles. Propellants include gaseous nitrogen, sulfur hexafluoride, the refrigerant R-236fa, and subliming solids such as iodine.",x:"A gas bottle, some valves and tiny nozzles."},whyChosen:{e:"Chosen when you need modest, precise, reliable manoeuvres and cannot accept the risk or the paperwork of an energetic propellant. MarCO used R-236fa cold gas — four attitude thrusters and four trajectory-correction thrusters per spacecraft — to fly to Mars and keep its antenna pointed at Earth during InSight’s landing.",x:"Picked when you need small, gentle, dependable nudges. The two MarCO satellites used this to fly all the way to Mars."},tradeoffs:{strengths:[{e:"Very simple, no combustion, and much easier to get through launch safety review.",x:"Simple and safe — nothing burns."},{e:"Precise small impulses, good for attitude control and fine trajectory correction.",x:"Great for tiny, careful pushes."},{e:"Genuine deep-space heritage.",x:"Has really flown to Mars."}],limits:[{e:"Low specific impulse — NASA SoA gives cold gas at 40–110 s, so you carry a lot of mass for little velocity change.",x:"Very inefficient: you carry lots of gas for a small push."},{e:"A pressurised tank is still a stored-energy item that launch providers scrutinise.",x:"A pressure tank still makes rocket people nervous."},{e:"Valve leakage is a classic long-duration failure mode.",x:"Valves can leak slowly and waste all your gas."}]},facts:[{label:"Performance",value:"NASA SoA: thrust 10 μN – 3.6 N, specific impulse 40–110 s"},{label:"MarCO",value:"R-236fa cold gas, eight thrusters total (four attitude control, four trajectory correction), Mars InSight relay, 2018"},{label:"Other flights",value:"CanX-4/CanX-5 flew liquid sulfur hexafluoride for formation flying in 2014; ThrustMe I2T5 flew iodine in 2019"}],flown:"MarCO-A and MarCO-B, CanX-4/5",sources:["soa-prop","nasa-marco"],tags:["prop:coldgas","prop:manoeuvre-small","prop:low-isp","eol:propulsive","prop:pressure-vessel"]},{id:"electric",level:"both",name:{e:"Electric propulsion (electrospray / gridded ion)",x:"Electric engine"},blurb:{e:"Accelerate charged particles with electric fields. Feeble thrust, extraordinary efficiency.",x:"Push out tiny electrically charged bits, incredibly fast."},how:{e:"Instead of getting energy from pressure or combustion, you use the spacecraft’s electrical power to accelerate ions to enormous exhaust velocities. An electrospray thruster pulls charged droplets straight out of an ionic liquid with a strong electric field; a gridded ion engine ionises a gas and accelerates it through charged grids. Because exhaust velocity is so high, you need far less propellant for the same velocity change — but the thrust is measured in micronewtons, so you must fire for weeks.",x:"Instead of burning fuel, it uses electricity to fling tiny charged particles out of the back, unbelievably fast. Each particle is minuscule, so the push is gentler than a feather landing on your hand — but it can keep pushing for months, and that adds up to a lot."},madeOf:{e:"For electrospray: emitter arrays and extractor electrodes with an ionic liquid propellant. For gridded ion: an ionisation chamber, accelerator grids, a neutraliser, and often xenon or iodine. Both need high-voltage power processing electronics.",x:"Very fine needles or grids with high voltage across them, plus a special propellant and electronics to make the high voltage."},whyChosen:{e:"Chosen when total velocity change matters more than how fast you get it. Because specific impulse can be ten to thirty times a cold gas system, you can do orbit raising, constellation phasing, station-keeping and disposal on a propellant mass a CubeSat can actually carry.",x:"Used when you need to change your orbit a lot over a long time. It is so efficient that a tiny amount of propellant goes an enormous way."},tradeoffs:{strengths:[{e:"Very high specific impulse — electrospray 225–3,000 s, gridded ion 500–3,000 s.",x:"Uses hardly any propellant for how much it can do."},{e:"Enables real orbit changes and long-term station-keeping from a CubeSat.",x:"Lets a tiny satellite genuinely change where it flies."},{e:"No pressurised combustion, and some propellants are solids at room temperature.",x:"Nothing burns, and some versions use a solid that never leaks."}],limits:[{e:"Thrust is micronewtons to millinewtons — you cannot do anything quickly.",x:"The push is so gentle that everything takes weeks."},{e:"Needs a lot of electrical power, which competes directly with your payload.",x:"Uses a lot of electricity that your instrument also wants."},{e:"High-voltage electronics in vacuum bring their own failure modes.",x:"High voltage in space can arc and break things."},{e:"Cannot perform an urgent collision-avoidance manoeuvre.",x:"Too slow to dodge anything in a hurry."}]},facts:[{label:"Electrospray",value:"NASA SoA: 20 μN – 20 mN thrust, 225–3,000 s Isp, ionic liquid propellants"},{label:"Gridded ion",value:"0.1–20 mN thrust, 500–3,000 s Isp"},{label:"Iodine",value:'ThrustMe I2T5 was the "First iodine propulsion system to be spaceflight tested, flown on the Xiaoxiang 1-08 satellite in 2019."'}],flown:"ThrustMe I2T5; Enpulsion and Busek units across many smallsats",sources:["soa-prop"],tags:["prop:electric","prop:manoeuvre-large","prop:high-isp","prop:high-power","prop:slow","eol:propulsive"]},{id:"green-mono",level:"engineer",name:{e:"Green monopropellant",x:"A safer chemical rocket"},blurb:{e:"A high-performance chemical thruster using a propellant far less toxic than hydrazine.",x:"A real little rocket engine that uses much safer fuel."},how:{e:"The propellant flows over a heated catalyst bed and decomposes exothermically into hot gas, which expands through a nozzle. No oxidiser tank and no ignition system — the catalyst does the work. Green propellants like ASCENT (AF-M315E) and LMP-103S replace hydrazine, which is acutely toxic and requires suited handling crews.",x:"The liquid flows over a special hot metal surface that makes it break apart into hot gas all by itself. That gas rushes out of the nozzle and pushes the satellite. The old fuel for this was so poisonous that people had to wear spacesuits to load it — the new stuff is far safer."},madeOf:{e:"A propellant tank, a catalyst bed with a preheater, valves and a nozzle. Lunar Flashlight used four 0.1 N ASCENT thrusters with additively manufactured propellant management devices.",x:"A fuel tank, a heated catalyst, valves and a nozzle — a proper miniature rocket engine."},whyChosen:{e:"Chosen when you need meaningful thrust with reasonable efficiency and cannot wait weeks for an electric thruster: escaping Earth orbit, capturing into a lunar orbit, or executing a time-critical manoeuvre.",x:"Used when you need a real push right now — like leaving Earth orbit to go to the Moon."},tradeoffs:{strengths:[{e:"Far better Isp than cold gas with real thrust levels.",x:"Much stronger and more efficient than gas puffs."},{e:"Substantially safer to handle than hydrazine.",x:"Much safer than the old poisonous fuel."},{e:"Flight-demonstrated on GPIM and Lunar Flashlight.",x:"Already tested in real missions."}],limits:[{e:"Still an energetic propellant with a pressurised system — the hardest safety review here.",x:"Still a fuel tank, so still the hardest to get permission for."},{e:"The catalyst bed needs preheating, which costs power before every burn.",x:"It has to warm up before every firing, which uses power."},{e:"Complex and expensive relative to everything else on this list.",x:"Complicated and expensive."}]},facts:[{label:"Performance",value:"NASA SoA: green propellants sit in the 200–310 s Isp band; hydrazine monoprop is 180–285 s at 0.25–28 N"},{label:"GPIM",value:"Five 1-N ASCENT thrusters, launched June 2019 on Falcon Heavy"},{label:"Lunar Flashlight",value:"Four 0.1-N ASCENT thrusters (Rubicon Space Systems), launched December 2022"}],flown:"GPIM (2019), Lunar Flashlight (2022)",sources:["soa-prop"],tags:["prop:chemical","prop:manoeuvre-large","prop:fast","prop:pressure-vessel","prop:complex","eol:propulsive"]}]},ee=[op,rp,sp,ip,lp,up,cp,dp,hp,pp,fp].sort((e,t)=>e.order-t.order),wn=e=>ee.find(t=>t.id===e),Tc=(e,t)=>{var n;return(n=wn(e))==null?void 0:n.options.find(a=>a.id===t)},Bt=e=>!!e&&typeof e=="object"&&e.kind==="custom";function Mo(e,t){if(!t)return null;if(Bt(t))return{id:"custom",custom:!0,name:{e:t.name,x:t.name},blurb:{e:t.summary,x:t.summary},tags:t.tags||[],detail:t};const n=Tc(e,t);return n?{...n,custom:!1}:null}function mp(e,t=[]){const n=wn(e);if(!n||!t.length)return null;let a=null,o=0;for(const r of n.options){const s=r.tags.filter(u=>t.includes(u)).length;s>o&&(a=r,o=s)}return o>0?a:null}const gp=(e,t)=>e.options.filter(n=>n.level==="both"||t==="engineer"),sa=e=>{const t=new Set;for(const[n,a]of Object.entries(e)){const o=Mo(n,a);o&&o.tags.forEach(r=>t.add(r))}return t};function yp(e,t){var n;return t?Bt(t)?((n=mp(e,t.tags))==null?void 0:n.id)??null:t:null}const Ec=[{id:"wildfire",codename:"EMBER",name:{e:"Wildfire Watch",x:"Find Fires From Space"},tagline:{e:"Detect and map active fire fronts by their heat, day or night.",x:"Spot fires while they are still small — even in the dark."},brief:{e:"Fires give off far more long-wave and mid-wave infrared light than the ground around them, so a thermal camera sees a fire front even through smoke and darkness. This is the same trick OroraTech uses on its FOREST CubeSats.",x:"A fire is much hotter than the trees around it. Special heat-cameras can see that hot spot even at night or through smoke — regular cameras cannot."},realAnalog:"OroraTech FOREST-1 (3U), FOREST-2 (6U) — uncooled microbolometer thermal imagers, ~200 m ground sampling distance, ±1 °C absolute temperature accuracy",needs:["sees-heat","frequent-revisit","low-latency-downlink","stable-pointing"],payloadFit:{"thermal-ir":"ideal","vis-multispectral":"partial",hyperspectral:"partial","sdr-receiver":"no","gnss-ro":"no","particle-telescope":"no","ka-radar":"no"},sources:["eo-ororatech"]},{id:"maritime",codename:"BEACON",name:{e:"Ships & Planes Tracker",x:"Listen for Ships and Planes"},tagline:{e:"Receive AIS and ADS-B beacons from ships and aircraft far beyond coastal radio range.",x:'Hear the little "I am here!" radio messages ships and planes send out.'},brief:{e:"Ships broadcast AIS position messages on VHF and aircraft broadcast ADS-B; both are line-of-sight from the ground but wide open from orbit. A satellite is essentially a very tall radio mast, so a software-defined radio can log thousands of vessels per pass. Spire flies exactly this on 3U Lemur-2 buses.",x:"Ships and planes shout out where they are on the radio. From the ground you can only hear them nearby — but from space you can hear a whole ocean at once."},realAnalog:"Spire Global Lemur-2 (3U, ~4.6 kg) carrying SENSE (AIS) and an ADS-B receiver; 100+ satellites at 400–600 km",needs:["listens-radio","wide-field","modest-downlink"],payloadFit:{"sdr-receiver":"ideal","gnss-ro":"partial","thermal-ir":"no","vis-multispectral":"no",hyperspectral:"no","particle-telescope":"no","ka-radar":"no"},sources:["eo-spire"]},{id:"weather",codename:"SOUNDER",name:{e:"Weather & Atmosphere",x:"Measure the Air and Storms"},tagline:{e:"Profile temperature and humidity through the atmosphere, or see inside a raincloud.",x:"Find out how warm and wet the air is all the way up — and peek inside storms."},brief:{e:"GNSS radio occultation watches a GPS signal bend as it grazes the atmosphere; the bending angle gives a vertical profile of density, temperature and water vapour. A miniaturised Ka-band radar can instead look straight down inside precipitation. Both are flying today on CubeSats.",x:"Radio signals bend when they pass through air, and they bend more through thick or wet air. By measuring the bending, a satellite can work out the weather high above the clouds."},realAnalog:"Spire STRATOS GNSS-RO receivers; NASA JPL RainCube — a 6U CubeSat that flew a working Ka-band precipitation radar with a deployable mesh antenna",needs:["profiles-atmosphere","precise-timing","modest-downlink"],payloadFit:{"gnss-ro":"ideal","ka-radar":"ideal",hyperspectral:"no","sdr-receiver":"partial","thermal-ir":"no","vis-multispectral":"no","particle-telescope":"no"},sources:["eo-spire","jpl-raincube"]},{id:"spaceweather",codename:"AURORA",name:{e:"Space Weather Sentinel",x:"Watch the Sun Attack"},tagline:{e:"Measure solar energetic particles, radiation-belt electrons, or solar soft X-ray flares.",x:"Count the tiny bits of the Sun that come flying at Earth."},brief:{e:"The Sun throws high-energy protons and electrons at Earth, and flares brighten sharply in soft X-rays. A small particle telescope or X-ray spectrometer measures those directly from orbit. Two university CubeSats — CSSWE and MinXSS — did this and published real peer-reviewed science.",x:"The Sun sometimes throws storms of tiny particles at Earth. They can break satellites and make the northern lights. A small detector can count them as they arrive."},realAnalog:"CSSWE (3U, CU Boulder) with the REPTile particle telescope; MinXSS-1 (3U) soft X-ray spectrometer, flown 2016–2017",needs:["detects-particles","radiation-hard","modest-downlink"],payloadFit:{"particle-telescope":"ideal","gnss-ro":"partial","sdr-receiver":"no","thermal-ir":"no","vis-multispectral":"no",hyperspectral:"no","ka-radar":"no"},sources:["eo-csswe","eo-minxss"]},{id:"landcover",codename:"VERDANT",name:{e:"Farm & Forest Health",x:"Check on Plants From Space"},tagline:{e:"Image crops and forests in visible and near-infrared to measure plant health.",x:"Take special photos that show which plants are healthy and which are thirsty."},brief:{e:"Healthy chlorophyll absorbs red light and reflects near-infrared hard. Comparing those two bands (the basis of NDVI) turns an ordinary-looking image into a map of plant stress. Planet flies ~3–5 m resolution multispectral imagers on 3U Doves in sun-synchronous orbit to do this daily.",x:"Healthy leaves bounce back a colour our eyes cannot see. If a satellite camera can see that colour, it can tell healthy plants from sick ones — from hundreds of kilometres up."},realAnalog:"Planet Dove / SuperDove — 3U CubeSats, ~3–5 m resolution, operating around 475–525 km sun-synchronous orbit",needs:["sees-colour","consistent-lighting","high-downlink","stable-pointing"],payloadFit:{"vis-multispectral":"ideal",hyperspectral:"ideal","thermal-ir":"partial","sdr-receiver":"no","gnss-ro":"no","particle-telescope":"no","ka-radar":"no"},sources:["eo-planet"]}],Js=e=>Ec.find(t=>t.id===e);function wp({mode:e,setMode:t,mission:n,picks:a,onHome:o,screen:r}){const s=ee.filter(u=>a[u.id]).length;return i.jsxs("header",{className:"topbar",children:[i.jsxs("div",{className:"topbar__brand",children:[i.jsxs("button",{className:"topbar__mark",onClick:o,children:["CUBESAT",i.jsx("span",{children:"/"}),"BUILDER"]}),n&&i.jsxs("div",{className:"topbar__mission mono",children:[i.jsx("span",{style:{color:"var(--primary)"},children:n.codename}),i.jsx("span",{children:"·"}),i.jsx("span",{children:e==="explorer"?n.name.x:n.name.e})]})]}),n&&r!=="mission"&&i.jsxs("div",{className:"topbar__progress",children:[i.jsxs("span",{className:"label",children:[s,"/",ee.length]}),i.jsx("div",{className:"pips",children:ee.map(u=>i.jsx("span",{className:`pip ${a[u.id]?"pip--done":""}`,title:u.code},u.id))})]}),i.jsxs("div",{className:"modeswitch",role:"group","aria-label":"Reading mode",children:[i.jsx("button",{"aria-pressed":e==="explorer",onClick:()=>t("explorer"),children:"Explorer"}),i.jsx("button",{"aria-pressed":e==="engineer",onClick:()=>t("engineer"),children:"Engineer"})]}),i.jsx("span",{className:"modeswitch__hint",children:e==="explorer"?"Ages under 11 · simpler words, same facts":"Ages 11–18 · full vocabulary, more options"})]})}const Nc={"soa-gnc":{short:"NASA SoA — GNC",title:"NASA State-of-the-Art of Small Spacecraft Technology, Ch. 5: Guidance, Navigation & Control",url:"https://www.nasa.gov/smallsat-institute/sst-soa/guidance-navigation-and-control/",org:"NASA Ames / Small Spacecraft Systems Virtual Institute"},"soa-power":{short:"NASA SoA — Power",title:"NASA State-of-the-Art of Small Spacecraft Technology, Ch. 3: Power",url:"https://www.nasa.gov/smallsat-institute/sst-soa/power/",org:"NASA Ames / S3VI"},"soa-prop":{short:"NASA SoA — Propulsion",title:"NASA State-of-the-Art of Small Spacecraft Technology, Ch. 4: In-Space Propulsion",url:"https://www.nasa.gov/smallsat-institute/sst-soa/in-space-propulsion/",org:"NASA Ames / S3VI"},"soa-struct":{short:"NASA SoA — Structures",title:"NASA State-of-the-Art of Small Spacecraft Technology, Ch. 6: Structures, Materials & Mechanisms",url:"https://www.nasa.gov/smallsat-institute/sst-soa/structures-materials-and-mechanisms/",org:"NASA Ames / S3VI"},"soa-thermal":{short:"NASA SoA — Thermal",title:"NASA State-of-the-Art of Small Spacecraft Technology, Ch. 7: Thermal Control",url:"https://www.nasa.gov/smallsat-institute/sst-soa/thermal-control/",org:"NASA Ames / S3VI"},"soa-avionics":{short:"NASA SoA — Avionics",title:"NASA State-of-the-Art of Small Spacecraft Technology, Ch. 8: Small Spacecraft Avionics (C&DH)",url:"https://www.nasa.gov/smallsat-institute/sst-soa/small-spacecraft-avionics/",org:"NASA Ames / S3VI"},"soa-comms":{short:"NASA SoA — Comms",title:"NASA State-of-the-Art of Small Spacecraft Technology, Ch. 9: Communications",url:"https://www.nasa.gov/smallsat-institute/sst-soa/communications/",org:"NASA Ames / S3VI"},"soa-deorbit":{short:"NASA SoA — Deorbit",title:"NASA State-of-the-Art of Small Spacecraft Technology, Ch. 13: Deorbit Systems",url:"https://www.nasa.gov/smallsat-institute/sst-soa/deorbit-systems/",org:"NASA Ames / S3VI"},cubesat101:{short:"NASA CubeSat 101",title:"CubeSat 101: Basic Concepts and Processes for First-Time CubeSat Developers",url:"https://www.nasa.gov/wp-content/uploads/2017/03/nasa_csli_cubesat_101_508.pdf",org:"NASA CubeSat Launch Initiative"},cds:{short:"Cal Poly CDS Rev 14.1",title:"CubeSat Design Specification Rev. 14.1",url:"https://static1.squarespace.com/static/5418c831e4b0fa4ecac1bacd/t/62193b7fc9e72e0053f00910/1645820809779/CDS+REV14_1+2022-02-09.pdf",org:"The CubeSat Program, Cal Poly SLO"},"fcc-5yr":{short:"FCC 5-year rule",title:"FCC Second Report and Order: Mitigation of Orbital Debris in the New Space Age (5-year deorbit rule, Sept 2022)",url:"https://www.fcc.gov/document/fcc-adopts-new-5-year-rule-deorbiting-satellites-0",org:"U.S. Federal Communications Commission"},"eo-ororatech":{short:"eoPortal — FOREST",title:"FOREST Satellite Series (OroraTech) — thermal-infrared wildfire CubeSats",url:"https://www.eoportal.org/satellite-missions/forest",org:"ESA eoPortal"},"eo-planet":{short:"eoPortal — Planet",title:"Planet Flock / Dove imaging constellation",url:"https://www.eoportal.org/satellite-missions/planet",org:"ESA eoPortal"},"eo-spire":{short:"eoPortal — Lemur-2",title:"LEMUR-2 (Spire Global): AIS, ADS-B and GNSS radio occultation from 3U CubeSats",url:"https://www.eoportal.org/satellite-missions/spire-global",org:"ESA eoPortal"},"eo-csswe":{short:"eoPortal — CSSWE",title:"CSSWE (Colorado Student Space Weather Experiment) and the REPTile particle telescope",url:"https://www.eoportal.org/satellite-missions/csswe",org:"ESA eoPortal"},"eo-minxss":{short:"eoPortal — MinXSS",title:"MinXSS (Miniature X-ray Solar Spectrometer) 3U CubeSat",url:"https://www.eoportal.org/satellite-missions/minxss",org:"ESA eoPortal"},"jpl-raincube":{short:"NASA — RainCube",title:"RainCube: a 6U CubeSat carrying a Ka-band precipitation radar",url:"https://www.jpl.nasa.gov/missions/radar-in-a-cubesat-raincube/",org:"NASA JPL"},"nasa-marco":{short:"NASA — MarCO",title:"MarCO: the first CubeSats to fly to another planet (cold-gas propulsion, X-band reflectarray)",url:"https://www.jpl.nasa.gov/missions/mars-cube-one-marco/",org:"NASA JPL"},"nasa-tbird":{short:"NASA — TBIRD",title:"TBIRD: 200 Gbps optical downlink demonstration from a CubeSat",url:"https://www.nasa.gov/technology/space-comms/nasa-laser-communications-relay-tbird/",org:"NASA / MIT Lincoln Laboratory"},"nasa-cfs":{short:"NASA cFS",title:"core Flight System (cFS) — reusable flight software framework",url:"https://cfs.gsfc.nasa.gov/",org:"NASA Goddard"}},vp=Object.entries(Nc).map(([e,t])=>({id:e,...t})),O=(e,t)=>e?t==="explorer"?e.x:e.e:"";function ia({ids:e=[],label:t="Sources"}){return e.length?i.jsxs("div",{className:"sourcechips",children:[i.jsx("span",{className:"label",children:t}),e.map(n=>{const a=Nc[n];return a?i.jsx("a",{className:"sourcechip",href:a.url,target:"_blank",rel:"noreferrer",title:a.title,children:a.short},n):null})]}):null}const bp={good:{e:"This pays off",x:"Good news"},tension:{e:"Real tradeoff",x:"Watch out"},blocker:{e:"This does not work",x:"This will not work"}};function ei({rule:e,mode:t}){return i.jsxs("div",{className:`note note--${e.kind}`,children:[i.jsx("span",{className:"note__kind",children:O(bp[e.kind],t)}),i.jsx("div",{className:"note__title",children:O(e.title,t)}),i.jsx("p",{children:O(e.body,t)})]})}function xp({mode:e,onPick:t,onRefs:n}){return i.jsxs("div",{className:"shell",children:[i.jsxs("section",{className:"hero",children:[i.jsx("div",{className:"hero__eyebrow mono",children:"Mission planning · step 00"}),i.jsxs("h1",{children:["Build a real satellite,",i.jsx("br",{}),i.jsx("em",{children:"one subsystem at a time."})]}),i.jsx("p",{className:"hero__lede",children:e==="explorer"?"Real satellites are built out of parts that each have a job. You will choose every part yourself — and each time you choose, you will find out how that part really works on real spacecraft flying right now.":"Real engineers do not start with a satellite. They start with a question, then build the smallest spacecraft that can answer it. Pick your mission, then work through every subsystem — structure, power, brain, pointing, thermal, comms, propulsion — choosing between approaches that real CubeSats actually fly."})]}),i.jsx("div",{className:"label",style:{marginBottom:10},children:e==="explorer"?"Choose a job for your satellite":"Select mission objective"}),i.jsx("div",{className:"missiongrid",children:Ec.map(a=>i.jsxs("button",{className:"missioncard",onClick:()=>t(a.id),children:[i.jsx("div",{className:"missioncard__code mono",children:a.codename}),i.jsx("h3",{children:O(a.name,e)}),i.jsx("p",{children:O(a.tagline,e)}),i.jsx("div",{className:"missioncard__go",children:"Select →"})]},a.id))}),i.jsxs("div",{style:{marginTop:36,maxWidth:720},children:[i.jsx(ia,{ids:["soa-gnc","cubesat101","cds","fcc-5yr"],label:e==="explorer"?"Where the facts come from":"Primary references"}),i.jsxs("p",{style:{marginTop:14,color:"var(--muted-dim)",fontSize:"0.88rem"},children:["Every option in this app describes hardware that has genuinely flown, with figures taken from published NASA and mission sources."," ",i.jsx("button",{className:"linkbtn",onClick:n,children:"See the full reference list"})]})]})]})}const ti=[{id:"ir-needs-thermal-stability",station:"thermal",kind:"tension",needs:["payload:thermal-ir"],title:{e:"Your detector is a thermometer, so its own temperature matters",x:"Your heat camera needs to stay a steady temperature"},body:{e:"A microbolometer measures incoming infrared as a tiny change in its own temperature. If the detector itself drifts, that looks exactly like the scene changing. Real thermal imagers hold the focal plane at a controlled temperature or continuously recalibrate against a known reference, which is why a purely passive thermal design is a genuine risk here.",x:"Your heat camera works by letting heat rays warm up tiny pads inside it. So if the camera itself gets warmer or colder,
